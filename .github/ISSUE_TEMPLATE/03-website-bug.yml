name: Report a website bug
description: Begin in Tavernary to report a website problem, then review it here.
title: "[Website bug]: "
labels:
  - website-bug
body:
  - type: markdown
    attributes:
      value: |
        Tavernary prepared this review. Check the values, then create or cancel the issue. To make changes, return to https://tavernary.org/help/report-website/ and open a fresh GitHub review. The generated manifest is the automation payload; the readable fields are review-only.
  - type: input
    id: category
    attributes:
      label: Category
      description: "Use exactly one: Search, filters, or sorting; Navigation or link; Display, layout, or theme; Form submission or GitHub handoff; Kit builder or catalog interaction; Accessibility; Performance or loading; Other website behavior"
      placeholder: Search, filters, or sorting
    validations:
      required: false
  - type: input
    id: page-url
    attributes:
      label: Page URL
      description: Enter the Tavernary page where the problem occurred. An HTTPS URL or site path beginning with `/` is accepted.
      placeholder: https://tavernary.org/
    validations:
      required: false
  - type: textarea
    id: actual-behavior
    attributes:
      label: What happened?
      description: Describe what Tavernary did.
    validations:
      required: false
  - type: textarea
    id: expected-behavior
    attributes:
      label: What did you expect?
      description: Describe the behavior you expected instead.
    validations:
      required: false
  - type: textarea
    id: reproduction-steps
    attributes:
      label: Steps to reproduce
      description: Include the search, filters, view, Kit, or project involved.
    validations:
      required: false
  - type: input
    id: browser
    attributes:
      label: Browser
      placeholder: Firefox 128
    validations:
      required: false
  - type: input
    id: device
    attributes:
      label: Device
      placeholder: Windows 11 desktop
    validations:
      required: false
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Include any other public details that may help reproduce the problem.
    validations:
      required: false
  - type: textarea
    id: help-manifest
    attributes:
      label: Help manifest
      description: Required automation payload generated by Tavernary. Keep this JSON unchanged.
      render: json
    validations:
      required: true
