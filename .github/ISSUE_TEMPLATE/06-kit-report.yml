name: Report a Kit
description: Begin in Tavernary to report a Kit concern, then review it here.
title: "[Kit report]: "
labels:
  - kit-report
body:
  - type: markdown
    attributes:
      value: |
        Tavernary prepared this review. Check the values, then create or cancel the issue. To make changes, return to https://tavernary.org/menu/report-kit/ and open a fresh GitHub review. The generated manifest is the automation payload; the readable fields are review-only.
  - type: input
    id: kit-id
    attributes:
      label: Kit ID
    validations:
      required: false
  - type: input
    id: share-url
    attributes:
      label: Kit share URL
      placeholder: https://tavernary.org/?kit=example-kit
    validations:
      required: false
  - type: input
    id: category
    attributes:
      label: Category
      description: "Use exactly one: Compatibility problem; Unsafe or malicious included project; Abusive or inappropriate content; Broken, removed, or unavailable project; Misleading title or description; Duplicate Kit; Author or attribution concern; Other Kit concern"
      placeholder: Compatibility problem
    validations:
      required: false
  - type: textarea
    id: affected-project-ids
    attributes:
      label: Affected project IDs
      description: For compatibility or unavailable-project reports, enter up to 50 project IDs separated by commas or new lines.
    validations:
      required: false
  - type: textarea
    id: details
    attributes:
      label: Details
      description: Explain the concern and the outcome you are requesting.
    validations:
      required: false
  - type: textarea
    id: evidence
    attributes:
      label: Supporting evidence
      description: Link to public source material that supports the report when possible.
    validations:
      required: false
  - type: textarea
    id: help-manifest
    attributes:
      label: Help manifest
      description: Required automation payload generated by Tavernary. Keep this JSON unchanged.
      render: json
    validations:
      required: true
