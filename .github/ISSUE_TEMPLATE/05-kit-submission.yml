name: Submit or edit a Kit
description: Propose a new Kit or an author revision for maintainer review.
title: "[Kit submission]: "
labels:
  - kit-submission
body:
  - type: markdown
    attributes:
      value: |
        Kit submissions are validated automatically and published only after maintainer review. The live Kit remains unchanged while an edit is reviewed.
  - type: dropdown
    id: operation
    attributes:
      label: Operation
      options:
        - Create
        - Edit
    validations:
      required: true
  - type: input
    id: kit-id
    attributes:
      label: Kit ID
      description: Required for edits. Leave blank for a new Kit.
    validations:
      required: false
  - type: input
    id: title
    attributes:
      label: Kit title
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Kit description
    validations:
      required: true
  - type: textarea
    id: manifest
    attributes:
      label: Kit manifest
      description: Keep the JSON generated by Tavernary unchanged.
      render: json
    validations:
      required: true
  - type: checkboxes
    id: contribution-terms
    attributes:
      label: Contribution terms
      options:
        - label: I created or am authorized to submit this Kit title and description, and I agree they may be published under DbCL 1.0 as part of Tavernary's ODbL 1.0 catalog.
          required: true
