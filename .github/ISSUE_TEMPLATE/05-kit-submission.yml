name: Submit or edit a Kit
description: Propose a new Kit or an author revision for maintainer review.
title: "[Kit submission]: "
labels:
  - kit-submission
body:
  - type: markdown
    attributes:
      value: |
        Build a new Kit in Tavernary, or use **Edit Kit** on a published Kit, before submitting this form. Submissions are validated automatically and published only after maintainer review. The live Kit remains unchanged while an edit is reviewed.
  - type: input
    id: kit-title
    attributes:
      label: Kit title
    validations:
      required: true
  - type: textarea
    id: kit-description
    attributes:
      label: Kit description
    validations:
      required: true
  - type: textarea
    id: manifest
    attributes:
      label: Kit manifest
      description: Keep the JSON generated by Tavernary unchanged.
      render: json
    validations:
      required: true
