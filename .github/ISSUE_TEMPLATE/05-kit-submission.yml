name: Submit or edit a Kit
description: Begin in Tavernary to create or edit a Kit, then review it here.
title: "[Kit submission]: "
labels:
  - kit-submission
body:
  - type: markdown
    attributes:
      value: |
        Tavernary prepared this review. Check the values, then create or cancel the issue. To make changes, return to https://tavernary.org/?mode=kits and open a fresh GitHub review. The generated manifest is the automation payload; the readable fields are review-only.
  - type: input
    id: kit-title
    attributes:
      label: Kit title
    validations:
      required: false
  - type: textarea
    id: kit-description
    attributes:
      label: Kit description
    validations:
      required: false
  - type: textarea
    id: manifest
    attributes:
      label: Kit manifest
      description: Keep the JSON generated by Tavernary unchanged.
      render: json
    validations:
      required: true
