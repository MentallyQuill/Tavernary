name: Manage a project listing
description: Begin in Tavernary to manage cards or sources, then review the owner request here.
title: "[Project owner request]"
labels:
  - project-owner-request
body:
  - type: markdown
    attributes:
      value: |
        Tavernary prepared this review. Check the values, then create or cancel the issue. To make changes, return to https://tavernary.org/help/manage-project/ and open a fresh GitHub review. The generated manifest is the automation payload; the readable fields are review-only.

        This issue will be public. Do not include secrets, passwords, API keys, private personal information, or unpublished security details. GitHub automation verifies the issue author as either the current personal repository owner or a reviewed Tavernary owner, admin, or maintainer.
  - type: input
    id: request-type
    attributes:
      label: Request type
      description: "Use one: Edit card details; Add cards from this source; Retire this card; Restore this card; Update repository location; Permanently delist this source."
      placeholder: Edit card details
    validations:
      required: false
  - type: input
    id: source-id
    attributes:
      label: Source ID
      description: The stable Tavernary source ID shared by every card from this GitHub repository.
    validations:
      required: false
  - type: input
    id: project-id
    attributes:
      label: Project ID
      description: The stable Tavernary card ID. Leave this empty only when adding cards or permanently delisting the whole source.
    validations:
      required: false
  - type: input
    id: repository
    attributes:
      label: Current repository
      description: The current source URL when the selected record has one.
      placeholder: https://github.com/owner/repository
    validations:
      required: false
  - type: input
    id: proposed-name
    attributes:
      label: Proposed display name
      description: Used only for a card-details edit.
    validations:
      required: false
  - type: textarea
    id: proposed-summary
    attributes:
      label: Proposed summary
      description: >-
        Used only for a card-details edit. Plain text, 220 characters maximum.
        Tavernary preserves owner and authorized staff wording whenever
        possible. Mature and consensual adult themes are permitted, but content
        promoting hatred or discrimination, sexual exploitation of minors, or
        other material prohibited by Tavernary's Catalog Policy is not.
        Ordinary profanity is permitted. Read the policy:
        https://mentallyquill.github.io/Tavernary/catalog-policy/
    validations:
      required: false
  - type: textarea
    id: supported-frontends
    attributes:
      label: Supported frontends
      description: Used only for a card-details edit. Enter one controlled frontend ID per line.
    validations:
      required: false
  - type: input
    id: primary-function
    attributes:
      label: Primary function
      description: Used only for an Extension card-details edit. Frontends and System Presets use their structural primary function.
    validations:
      required: false
  - type: textarea
    id: tags
    attributes:
      label: Tags
      description: Used only for a card-details edit. Enter up to six controlled Tavernary tag IDs, one per line.
    validations:
      required: false
  - type: input
    id: summary-metadata-mode
    attributes:
      label: Summary metadata mode
      description: Used only for a card-details edit. Enter automatic or manual.
    validations:
      required: false
  - type: input
    id: tag-metadata-mode
    attributes:
      label: Tag metadata mode
      description: Used only for a card-details edit. Enter automatic or manual.
    validations:
      required: false
  - type: textarea
    id: model-families
    attributes:
      label: Model families
      description: Used only for a Preset card-details edit. Enter one controlled model-family ID per line.
    validations:
      required: false
  - type: textarea
    id: completion-formats
    attributes:
      label: Completion formats
      description: Used only for a Preset card-details edit. Enter one controlled completion-format ID per line.
    validations:
      required: false
  - type: input
    id: proposed-repository
    attributes:
      label: Proposed repository
      description: Used only for a repository-location update. This must be the same immutable repository at its current public GitHub URL.
      placeholder: https://github.com/owner/renamed-repository
    validations:
      required: false
  - type: textarea
    id: explanation
    attributes:
      label: Explanation or public note
      description: Optional public context or supporting documentation.
    validations:
      required: false
  - type: input
    id: delist-confirmation
    attributes:
      label: Delist confirmation
      description: >-
        For permanent source delisting, enter the complete owner/repository
        identity. This hides every sibling card and permanently reserves the
        immutable repository identity.
    validations:
      required: false
  - type: textarea
    id: owner-request-manifest
    attributes:
      label: Owner request manifest
      description: Required automation payload generated by Tavernary. Keep this JSON unchanged.
      render: json
    validations:
      required: true
