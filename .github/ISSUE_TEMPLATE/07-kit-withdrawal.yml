name: Withdraw a Kit
description: Begin in Tavernary to request author withdrawal of a Kit, then review it here.
title: "[Kit withdrawal]: "
labels:
  - kit-withdrawal
body:
  - type: markdown
    attributes:
      value: |
        Tavernary prepared this review. Check the values, then create or cancel the issue. To make changes, return to https://tavernary.org/menu/withdraw-kit/ and open a fresh GitHub review. The generated manifest is the automation payload; the readable fields are review-only.

        GitHub's numeric user ID is checked against the Kit author. A matching author request creates a retained withdrawal tombstone.
  - type: input
    id: kit-id
    attributes:
      label: Kit ID
    validations:
      required: false
  - type: input
    id: share-url
    attributes:
      label: Kit share URL
    validations:
      required: false
  - type: input
    id: confirmation
    attributes:
      label: Confirmation
      description: "Readable value prepared by Tavernary: I request withdrawal of this Kit."
      placeholder: I request withdrawal of this Kit.
    validations:
      required: false
  - type: textarea
    id: withdrawal-manifest
    attributes:
      label: Kit withdrawal manifest
      description: Required automation payload generated by Tavernary. Keep this JSON unchanged.
      render: json
    validations:
      required: true
