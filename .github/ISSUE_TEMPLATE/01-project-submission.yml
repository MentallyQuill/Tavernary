name: Submit a project
description: Propose a public AI roleplay project for maintainer review.
title: "[Project submission]"
labels:
  - project-submission
body:
  - type: markdown
    attributes:
      value: |
        GitHub repository URL required for Extensions and Frontends, not for Presets. The Tavernary submission builder fills these fields automatically; this form remains available as a structured fallback.
  - type: dropdown
    id: project-type
    attributes:
      label: Project Type
      options:
        - Frontend
        - Extension
        - System Preset
    validations:
      required: true
  - type: input
    id: project-url
    attributes:
      label: Project URL
      placeholder: https://github.com/owner/repository
    validations:
      required: true
  - type: input
    id: project-name
    attributes:
      label: Project Name
      description: Optional for GitHub sources; required for external System Presets.
    validations:
      required: false
  - type: textarea
    id: project-description
    attributes:
      label: Short Description
      description: Optional for GitHub sources; required for external System Presets.
    validations:
      required: false
  - type: textarea
    id: supported-frontends
    attributes:
      label: Supported frontends
      description: For Extensions and System Presets, enter comma- or newline-separated frontend names or canonical URLs.
    validations:
      required: false
  - type: dropdown
    id: frontend-independent
    attributes:
      label: Frontend-independent
      description: Choose Yes only when a System Preset does not depend on a particular frontend.
      options:
        - "No"
        - "Yes"
      default: 0
    validations:
      required: true
  - type: textarea
    id: additional-context
    attributes:
      label: Anything we should know?
      description: Optional context that may help us review this project.
    validations:
      required: false
  - type: textarea
    id: project-manifest
    attributes:
      label: Project manifest
      description: Keep the JSON generated by Tavernary unchanged. Leave empty when using this fallback form directly.
      render: json
    validations:
      required: false
