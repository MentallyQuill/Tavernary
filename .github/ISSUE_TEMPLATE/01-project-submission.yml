name: Submit a project
description: Propose a public AI roleplay project for maintainer review.
title: "[Project submission]"
labels:
  - project-submission
body:
  - type: markdown
    attributes:
      value: |
        Use a public project source URL. The Tavernary submission builder provides contextual guidance for each project type. This form remains available as a structured fallback.
        Frontends and Extensions require a public GitHub or Codeberg repository.
  - type: input
    id: project-type
    attributes:
      label: Project Type
      description: Enter Frontend, Extension, or System Preset.
      placeholder: Frontend, Extension, or System Preset
    validations:
      required: true
  - type: input
    id: project-url
    attributes:
      label: Project URL
      placeholder: https://github.com/owner/repository or https://codeberg.org/owner/repository
    validations:
      required: true
  - type: input
    id: primary-function
    attributes:
      label: Primary function
      description: >-
        Extensions must enter one category: memory-retrieval,
        generation-reasoning, character-worldbuilding, rpg-systems,
        interface-workflow, or developer-infrastructure. Leave blank or enter
        the structural value frontend or preset for those project types.
      placeholder: Extension category only
    validations:
      required: false
  - type: input
    id: project-name
    attributes:
      label: Project Name
      description: Optional for GitHub and Codeberg sources; required for external System Presets.
    validations:
      required: false
  - type: textarea
    id: project-description
    attributes:
      label: Short Description
      description: >-
        Optional for GitHub and Codeberg sources; required for external System
        Presets. Maximum 220 characters. Community submissions are summarized
        from README evidence first, the repository description second, and this
        description third. Keep the description suitable for a public project
        catalog. Mature and consensual adult themes are permitted, but content
        promoting hatred or discrimination, sexual exploitation of minors, or
        other material prohibited by Tavernary's Catalog Policy is not.
        Ordinary profanity is permitted. Read the policy:
        https://mentallyquill.github.io/Tavernary/catalog-policy/
    validations:
      required: false
  - type: textarea
    id: supported-frontends
    attributes:
      label: Supported frontends
      description: For Extensions and System Presets, enter comma- or newline-separated frontend names or canonical URLs.
    validations:
      required: false
  - type: input
    id: frontend-independent
    attributes:
      label: Frontend-independent
      description: Enter Yes only when a System Preset does not depend on a particular frontend; otherwise enter No.
      placeholder: Yes or No
    validations:
      required: true
  - type: textarea
    id: additional-context
    attributes:
      label: Anything we should know?
      description: Optional context that may help us review this project.
    validations:
      required: false
  - type: textarea
    id: supported-model-families
    attributes:
      label: Supported model families
      description: >-
        System Presets only. Enter one canonical family ID per line:
        model-agnostic, claude, gpt, gemini, gemma, deepseek, glm, minimax,
        mimo, kimi, qwen, llama, or mistral.
    validations:
      required: false
  - type: input
    id: other-model-family
    attributes:
      label: Other model family
      description: System Presets only. A maintainer must reconcile this value before publication.
    validations:
      required: false
  - type: textarea
    id: completion-formats
    attributes:
      label: Completion formats
      description: >-
        System Presets only. Enter one canonical format ID per line:
        chat-completion or text-completion.
    validations:
      required: false
  - type: textarea
    id: project-manifest
    attributes:
      label: Project manifest
      description: Keep the JSON generated by Tavernary unchanged. Leave empty when using this fallback form directly.
      render: json
    validations:
      required: false
