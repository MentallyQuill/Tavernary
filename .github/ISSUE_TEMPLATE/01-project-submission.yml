name: Submit a project
description: Begin in Tavernary to prepare a public project submission, then review it here.
title: "[Project submission]"
labels:
  - project-submission
body:
  - type: markdown
    attributes:
      value: |
        Tavernary prepared this review. Check the values, then create or cancel the issue. To make changes, return to https://tavernary.org/submit/project/ and open a fresh GitHub review. The generated manifest is the automation payload; the readable fields are review-only.
  - type: input
    id: project-type
    attributes:
      label: Project Type
      description: "Readable value prepared by Tavernary. Expected one of: Frontend; Extension; System Preset."
      placeholder: Frontend, Extension, or System Preset
    validations:
      required: false
  - type: input
    id: project-url
    attributes:
      label: Project URL
      placeholder: https://github.com/owner/repository or https://codeberg.org/owner/repository
    validations:
      required: false
  - type: input
    id: primary-function
    attributes:
      label: Primary function
      description: "Readable value prepared by Tavernary. Extension values use a controlled primary-function ID; Frontends and System Presets use their structural value."
      placeholder: Extension category only
    validations:
      required: false
  - type: input
    id: description-choice
    attributes:
      label: Description choice
      description: "Readable value prepared by Tavernary. Expected one of: Let TavernAI write the description; Write the description myself."
      placeholder: Let TavernAI write the description
    validations:
      required: false
  - type: textarea
    id: project-description
    attributes:
      label: Short Description
      description: >-
        Readable owner-authored description when the manifest selects manual
        wording. Maximum 220 characters. Manual wording is used only after
        GitHub verifies the submitter as the personal repository owner. Keep
        the description suitable for a public project catalog. Mature and
        consensual adult themes are permitted, but content promoting hatred or
        discrimination, sexual exploitation of minors, or other material
        prohibited by Tavernary's Catalog Policy is not. Ordinary profanity is
        permitted. Read the policy:
        https://mentallyquill.github.io/Tavernary/catalog-policy/
    validations:
      required: false
  - type: input
    id: tag-choice
    attributes:
      label: Tag choice
      description: "Readable value prepared by Tavernary. Expected one of: Let Tavernary select tags; Set tags myself."
      placeholder: Let Tavernary select tags
    validations:
      required: false
  - type: textarea
    id: tags
    attributes:
      label: Tags
      description: >-
        Required only when you chose to set tags. Enter up to six controlled
        tag IDs, one per line. Use Tavernary's submission builder to search the
        applicable vocabulary and create the authoritative project manifest.
    validations:
      required: false
  - type: textarea
    id: supported-frontends
    attributes:
      label: Supported frontends
      description: For Extensions and System Presets, enter comma- or newline-separated frontend names or canonical URLs.
    validations:
      required: false
  - type: input
    id: frontend-independent
    attributes:
      label: Frontend-independent
      description: Enter Yes only when a System Preset does not depend on a particular frontend; otherwise enter No.
      placeholder: Yes or No
    validations:
      required: false
  - type: textarea
    id: additional-context
    attributes:
      label: Anything we should know?
      description: Optional context that may help us review this project.
    validations:
      required: false
  - type: textarea
    id: supported-model-families
    attributes:
      label: Supported model families
      description: >-
        System Presets only. Enter one canonical family ID per line:
        model-agnostic, claude, gpt, gemini, gemma, deepseek, glm, minimax,
        mimo, kimi, qwen, llama, or mistral.
    validations:
      required: false
  - type: input
    id: other-model-family
    attributes:
      label: Other model family
      description: >-
        System Presets only. Use this when the model family is not listed;
        publication pauses until the value can be matched to the catalog
        vocabulary.
    validations:
      required: false
  - type: textarea
    id: completion-formats
    attributes:
      label: Completion formats
      description: >-
        System Presets only. Enter one canonical format ID per line:
        chat-completion or text-completion.
    validations:
      required: false
  - type: textarea
    id: project-manifest
    attributes:
      label: Project manifest
      description: Required automation payload generated by Tavernary. Keep this JSON unchanged.
      render: json
    validations:
      required: true
