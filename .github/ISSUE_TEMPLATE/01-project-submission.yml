name: Submit a project
description: Propose a public AI roleplay project for maintainer review.
title: "[Project submission]"
labels:
  - project-submission
body:
  - type: markdown
    attributes:
      value: |
        Use a public project source URL. The Tavernary submission builder provides contextual guidance for each project type. This form remains available as a structured fallback.
  - type: dropdown
    id: project-type
    attributes:
      label: Project Type
      options:
        - Frontend
        - Extension
        - System Preset
    validations:
      required: true
  - type: input
    id: project-url
    attributes:
      label: Project URL
      placeholder: https://github.com/owner/repository
    validations:
      required: true
  - type: input
    id: project-name
    attributes:
      label: Project Name
      description: Optional for GitHub sources; required for external Frontends and System Presets.
    validations:
      required: false
  - type: textarea
    id: project-description
    attributes:
      label: Short Description
      description: >-
        Optional for GitHub sources; required for external Frontends and System
        Presets. This helps us understand the project and may be adapted into
        Tavernary's catalog summary for clarity and consistency. The published
        summary may be shortened or rewritten.
    validations:
      required: false
  - type: textarea
    id: supported-frontends
    attributes:
      label: Supported frontends
      description: For Extensions and System Presets, enter comma- or newline-separated frontend names or canonical URLs.
    validations:
      required: false
  - type: dropdown
    id: frontend-independent
    attributes:
      label: Frontend-independent
      description: Choose Yes only when a System Preset does not depend on a particular frontend.
      options:
        - "No"
        - "Yes"
      default: 0
    validations:
      required: true
  - type: textarea
    id: additional-context
    attributes:
      label: Anything we should know?
      description: Optional context that may help us review this project.
    validations:
      required: false
  - type: checkboxes
    id: supported-model-families
    attributes:
      label: Supported model families
      description: System Presets only. Model-Agnostic may be combined with tested or recommended families.
      options:
        - label: model-agnostic
        - label: claude
        - label: gpt
        - label: gemini
        - label: gemma
        - label: deepseek
        - label: glm
        - label: minimax
        - label: mimo
        - label: kimi
        - label: qwen
        - label: llama
        - label: mistral
  - type: input
    id: other-model-family
    attributes:
      label: Other model family
      description: System Presets only. A maintainer must reconcile this value before publication.
    validations:
      required: false
  - type: checkboxes
    id: completion-formats
    attributes:
      label: Completion formats
      description: System Presets only. Select at least one.
      options:
        - label: chat-completion
        - label: text-completion
  - type: textarea
    id: project-manifest
    attributes:
      label: Project manifest
      description: Keep the JSON generated by Tavernary unchanged. Leave empty when using this fallback form directly.
      render: json
    validations:
      required: false
