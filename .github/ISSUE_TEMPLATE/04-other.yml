name: Other
description: Begin in Tavernary to prepare another public request, then review it here.
title: "[Other]: "
labels:
  - other
body:
  - type: markdown
    attributes:
      value: |
        Tavernary prepared this review. Check the values, then create or cancel the issue. To make changes, return to https://tavernary.org/help/other/ and open a fresh GitHub review. The generated manifest is the automation payload; the readable fields are review-only.
  - type: input
    id: category
    attributes:
      label: Category
      description: "Use exactly one: Using Tavernary; An existing request; Suggest an improvement; Documentation or policy; Something else"
      placeholder: Using Tavernary
    validations:
      required: false
  - type: input
    id: subject
    attributes:
      label: Subject
      description: Give this report a short, specific subject.
    validations:
      required: false
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Explain what you want the Tavernary maintainers to know.
    validations:
      required: false
  - type: input
    id: relevant-url
    attributes:
      label: Relevant URL
      description: Link to a relevant public page, issue, pull request, or document when available.
      placeholder: https://example.com/
    validations:
      required: false
  - type: textarea
    id: help-manifest
    attributes:
      label: Help manifest
      description: Required automation payload generated by Tavernary. Keep this JSON unchanged.
      render: json
    validations:
      required: true
