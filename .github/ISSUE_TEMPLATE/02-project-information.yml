name: Report project information
description: Begin in Tavernary to report a catalog entry, then review it here.
title: "[Project information]: "
labels:
  - project-information
body:
  - type: markdown
    attributes:
      value: |
        Tavernary prepared this review. Check the values, then create or cancel the issue. To make changes, return to https://tavernary.org/help/report-project/ and open a fresh GitHub review. The generated manifest is the automation payload; the readable fields are review-only.
  - type: input
    id: project
    attributes:
      label: Project
      description: Enter the catalog project ID or name, an em dash, and its canonical source URL, for example `sillytavern-sillytavern — https://github.com/SillyTavern/SillyTavern`.
      placeholder: project-id — https://github.com/owner/repository
    validations:
      required: false
  - type: input
    id: category
    attributes:
      label: Category
      description: "Use exactly one: Incorrect or outdated card information; Repository moved, renamed, archived, or disappeared; Duplicate or wrong listing; Unsafe or malicious project; Abusive or inappropriate content; Copyright, trademark, or other rights concern; Something else about this listing"
      placeholder: Incorrect or outdated card information
    validations:
      required: false
  - type: textarea
    id: report
    attributes:
      label: What should be reviewed?
      description: Describe the inaccurate, outdated, unsafe, or inappropriate information.
    validations:
      required: false
  - type: textarea
    id: requested-outcome
    attributes:
      label: Requested outcome
      description: Describe the correction or review outcome you are requesting.
    validations:
      required: false
  - type: textarea
    id: evidence
    attributes:
      label: Supporting evidence
      description: Link to public source material that supports the correction when possible.
    validations:
      required: false
  - type: textarea
    id: help-manifest
    attributes:
      label: Help manifest
      description: Required automation payload generated by Tavernary. Keep this JSON unchanged.
      render: json
    validations:
      required: true
