name: "Site: Validate changes"
run-name: >-
  ${{ github.event_name == 'pull_request'
    && format('Site: Validate PR #{0}', github.event.pull_request.number)
    || format('Site: Validate {0}', github.ref_name) }}

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      route: ${{ steps.route.outputs.route }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Classify changed paths
        id: route
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -u
          route="full"
          paths_file="${RUNNER_TEMP}/ci-changed-paths.bin"
          base_sha=""
          head_sha=""

          if [[ "$EVENT_NAME" == "pull_request" &&
            "$PR_HEAD_REF" == automation/project-submission-* ]]; then
            route="content"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" &&
            ("$GITHUB_REF_NAME" == automation/project-submission-* ||
             "$GITHUB_REF_NAME" == automation/project-owner-request-*) ]]; then
            :
          else
            if [[ "$EVENT_NAME" == "pull_request" ]]; then
              base_sha="$PR_BASE_SHA"
              head_sha="$PR_HEAD_SHA"
            elif git fetch origin main &&
              base_sha="$(git merge-base origin/main HEAD)" &&
              head_sha="$(git rev-parse HEAD)"; then
              :
            fi

            if [[ -n "$base_sha" && -n "$head_sha" ]] &&
              git cat-file -e "${base_sha}^{commit}" &&
              git cat-file -e "${head_sha}^{commit}" &&
              git diff --no-renames --name-only -z "$base_sha" "$head_sha" > "$paths_file"; then
              classified="$(
                node scripts/ci/classify-pr-paths.mjs --paths-file "$paths_file"
              )" || classified="full"
              if [[ "$classified" == "content" || "$classified" == "full" ]]; then
                route="$classified"
              fi
            fi
          fi

          echo "route=$route" >> "$GITHUB_OUTPUT"
          echo "Selected CI route: $route"
      - name: Install dependencies
        run: npm ci
      - name: Run focused content checks
        if: steps.route.outputs.route == 'content'
        run: npm run check:content
      - name: Run complete static and unit checks
        if: steps.route.outputs.route == 'full'
        run: npm run check
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Run focused content browser smoke
        if: steps.route.outputs.route == 'content'
        run: npm run test:content-e2e
      - name: Run complete browser tests
        if: steps.route.outputs.route == 'full'
        run: npm run test:e2e
      - name: Run cross-browser TavernKeeper scan tests
        if: steps.route.outputs.route == 'full'
        run: npm run test:scan-e2e

  visual:
    needs: verify
    if: needs.verify.outputs.route == 'full'
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build static export
        run: npm run build
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Run colored TavernKeeper scan browser and visual coverage
        run: npm run test:scan
      - name: Run catalog layout regression tests
        run: npm run test:visual
      - name: Build deterministic Kit fixture export
        run: npm run build:test-kits
      - name: Run Kit fixture browser tests
        run: npm run test:kits-e2e
      - name: Run Kit fixture layout regression tests
        run: npm run test:kits-visual

  dispatch-project-publication:
    name: Dispatch validated project publication
    needs:
      - verify
      - visual
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      github.ref_name != 'automation/project-submission-0' &&
      (startsWith(github.ref_name, 'automation/project-submission-') ||
       startsWith(github.ref_name, 'automation/project-owner-request-')) &&
      needs.verify.result == 'success' &&
      (needs.visual.result == 'success' || needs.visual.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch exact validation run
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh workflow run publish-project-transaction.yml
          --repo "$GITHUB_REPOSITORY"
          --ref main
          -f validation_run_id="$GITHUB_RUN_ID"
