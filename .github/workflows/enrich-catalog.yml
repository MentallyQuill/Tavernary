name: Enrich catalog

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Verify the provider, run a five-card canary, start, or resume.
        type: choice
        options:
          - preflight
          - canary
          - start
          - resume
        default: preflight
      project_ids:
        description: Optional newline-separated project IDs; empty randomly selects five.
        type: string
        required: false
      batch_size:
        description: Frozen primary and retry batch size.
        type: number
        default: 20
      model_concurrency:
        description: Concurrent model calls, from 1 through 4.
        type: number
        default: 4

permissions:
  contents: write
  actions: write

concurrency:
  group: catalog-refresh
  cancel-in-progress: false

jobs:
  enrich:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run and publish verified enrichment rollout
        env:
          TAVERNARY_ENRICHMENT_API_URL: ${{ secrets.TAVERNARY_ENRICHMENT_API_URL }}
          TAVERNARY_ENRICHMENT_API_KEY: ${{ secrets.TAVERNARY_ENRICHMENT_API_KEY }}
          TAVERNARY_ENRICHMENT_MODEL: ${{ secrets.TAVERNARY_ENRICHMENT_MODEL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: ${{ inputs.mode }}
          PROJECT_IDS: ${{ inputs.project_ids || '' }}
          BATCH_SIZE: ${{ inputs.batch_size || 20 }}
          MODEL_CONCURRENCY: ${{ inputs.model_concurrency || 4 }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          publish_changes() {
            local commit_message="$1"
            REGISTRY_CHANGED=false
            PUBLISHED_SHA=""
            if ! git diff --quiet -- data/registry/projects; then
              REGISTRY_CHANGED=true
            fi
            git add data/registry/projects/*.json data/reports/enrichment-report.json
            if git diff --cached --quiet; then
              return
            fi
            git commit -m "$commit_message"
            for attempt in 1 2 3; do
              if git fetch origin main &&
                git rebase origin/main; then
                if npm run check &&
                  git push origin HEAD:main; then
                  PUBLISHED_SHA="$(git rev-parse HEAD)"
                  return
                fi
              fi
              conflicts="$(git diff --name-only --diff-filter=U)"
              if [[ -n "$conflicts" ]]; then
                echo "Enrichment publication conflict:"
                echo "$conflicts"
              fi
              git rebase --abort || true
              if (( attempt == 3 )); then
                exit 1
              fi
            done
          }

          publish_canary_preparation() {
            git add \
              data/snapshots/github/*.json \
              data/snapshots/github-refresh.json \
              data/registry/projects/*.json
            if git diff --cached --quiet; then
              return
            fi
            git commit -m "chore(catalog): prepare enrichment canary"
            for attempt in 1 2 3; do
              if git fetch origin main &&
                git rebase origin/main; then
                if npm run check &&
                  git push origin HEAD:main; then
                  return
                fi
              fi
              conflicts="$(git diff --name-only --diff-filter=U)"
              if [[ -n "$conflicts" ]]; then
                echo "Canary preparation publication conflict:"
                echo "$conflicts"
              fi
              git rebase --abort || true
              if (( attempt == 3 )); then
                exit 1
              fi
            done
          }

          choose_canary_projects() {
            if [[ "$existing_mode" == "canary" && "$existing_status" == "running" ]]; then
              PROJECT_IDS="$(jq -r '.manifest[]' data/reports/enrichment-report.json)"
            elif [[ -z "${PROJECT_IDS//[[:space:]]/}" ]]; then
              PROJECT_IDS="$(npm run --silent catalog:select-canary)"
            fi

            mapfile -t canary_ids < <(
              printf '%s\n' "$PROJECT_IDS" | sed '/^[[:space:]]*$/d'
            )
            if [[ "${#canary_ids[@]}" -ne 5 ]]; then
              echo "Canary requires exactly five project IDs." >&2
              exit 1
            fi
            unique_count="$(
              printf '%s\n' "${canary_ids[@]}" | sort -u | wc -l | tr -d '[:space:]'
            )"
            if [[ "$unique_count" -ne 5 ]]; then
              echo "Canary project IDs must be unique." >&2
              exit 1
            fi
            PROJECT_IDS="$(printf '%s\n' "${canary_ids[@]}")"
            echo "Selected canary projects:"
            printf '  %s\n' "${canary_ids[@]}"
          }

          prepare_canary_projects() {
            while IFS= read -r project_id; do
              [[ -z "$project_id" ]] && continue
              npm run catalog:refresh -- \
                --mode project \
                --project-id "$project_id" \
                --deployment-requested
            done <<< "$PROJECT_IDS"

            args=(--write)
            while IFS= read -r project_id; do
              [[ -z "$project_id" ]] || args+=(--project-id "$project_id")
            done <<< "$PROJECT_IDS"
            npm run catalog:backfill-identities -- "${args[@]}"
            npm run catalog:validate
            publish_canary_preparation
          }

          deploy_registry_changes() {
            DEPLOY_RUN_ID=""
            if [[ "$REGISTRY_CHANGED" != "true" ]]; then
              return
            fi
            if [[ -z "$PUBLISHED_SHA" ]]; then
              echo "Registry changed without a published commit." >&2
              exit 1
            fi
            gh workflow run deploy-pages.yml --ref main
            for attempt in {1..30}; do
              DEPLOY_RUN_ID="$(
                gh run list \
                  --workflow deploy-pages.yml \
                  --branch main \
                  --event workflow_dispatch \
                  --commit "$PUBLISHED_SHA" \
                  --limit 1 \
                  --json databaseId \
                  --jq '.[0].databaseId // empty'
              )"
              [[ -z "$DEPLOY_RUN_ID" ]] || break
              sleep 10
            done
            if [[ -z "$DEPLOY_RUN_ID" ]]; then
              echo "Pages deployment was not created for $PUBLISHED_SHA." >&2
              exit 1
            fi
            gh run watch "$DEPLOY_RUN_ID" --exit-status
          }

          run_batch() {
            local run_mode="$1"
            args=(--mode "$run_mode" --batch-size "$BATCH_SIZE" --concurrency "$MODEL_CONCURRENCY")
            if [[ "$run_mode" == "canary" ]]; then
              while IFS= read -r project_id; do
                [[ -z "$project_id" ]] || args+=(--project-id "$project_id")
              done <<< "$PROJECT_IDS"
            fi
            npm run catalog:enrich -- "${args[@]}"
            npm run check
            publish_changes "chore(catalog): enrich project metadata"
            deploy_registry_changes
          }

          enrichment_progress() {
            jq -c \
              '[.phase, .primary_cursor, .retry_cursor, (.retry_queue | length)]' \
              data/reports/enrichment-report.json
          }

          resume_batch() {
            progress_before="$(enrichment_progress)"
            run_batch resume
            run_mode="$(jq -r '.mode' data/reports/enrichment-report.json)"
            status="$(jq -r '.status' data/reports/enrichment-report.json)"
            test "$run_mode" = "full"
            progress_after="$(enrichment_progress)"
            if [[ "$status" == "running" && "$progress_after" == "$progress_before" ]]; then
              echo "::error title=Enrichment stalled::Enrichment remained running without advancing its phase or cursors."
              exit 1
            fi
          }

          if [[ "$MODE" == "preflight" || "$MODE" == "canary" ]]; then
            npm run catalog:enrich -- --mode preflight | tee "$RUNNER_TEMP/enrichment-preflight.log"
          fi
          if [[ "$MODE" == "preflight" ]]; then
            exit 0
          fi

          if [[ "$MODE" == "canary" ]]; then
            existing_mode="$(jq -r '.mode // empty' data/reports/enrichment-report.json 2>/dev/null || true)"
            existing_status="$(jq -r '.status // empty' data/reports/enrichment-report.json 2>/dev/null || true)"
            if [[ "$existing_mode" == "canary" && "$existing_status" == "awaiting-deployment" ]]; then
              PUBLISHED_SHA="$(git rev-parse HEAD)"
              REGISTRY_CHANGED=true
              deploy_registry_changes
            else
              choose_canary_projects
              prepare_canary_projects
              run_batch canary
            fi
            run_mode="$(jq -r '.mode' data/reports/enrichment-report.json)"
            status="$(jq -r '.status' data/reports/enrichment-report.json)"
            if [[ "$run_mode" != "canary" || "$status" != "awaiting-deployment" ]]; then
              echo "Canary did not reach deployment readiness." >&2
              exit 1
            fi
            if [[ "$REGISTRY_CHANGED" != "true" || -z "$DEPLOY_RUN_ID" ]]; then
              echo "Canary did not publish and deploy registry changes." >&2
              exit 1
            fi
            npm run catalog:enrich -- \
              --mode approve-canary \
              --commit-sha "$PUBLISHED_SHA" \
              --deployment-run-id "$DEPLOY_RUN_ID"
            npm run check
            publish_changes "chore(catalog): approve enrichment canary"
            test "$(jq -r '.status' data/reports/enrichment-report.json)" = "passed"
            exit 0
          fi

          if [[ "$MODE" == "start" ]]; then
            run_batch start
            run_mode="$(jq -r '.mode' data/reports/enrichment-report.json)"
            status="$(jq -r '.status' data/reports/enrichment-report.json)"
            test "$run_mode" = "full"
          else
            test "$MODE" = "resume"
            resume_batch
          fi
          while [[ "$status" == "running" ]]; do
            resume_batch
          done
          test "$status" = "complete"
      - name: Write sanitized workflow summary
        if: always()
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
        run: |
          if [[ "$MODE" == "preflight" ]]; then
            echo "## Enrichment provider preflight" >> "$GITHUB_STEP_SUMMARY"
            tail -n 1 "$RUNNER_TEMP/enrichment-preflight.log" >> "$GITHUB_STEP_SUMMARY"
          elif [[ -f data/reports/enrichment-report.json ]]; then
            node -e "const r=require('./data/reports/enrichment-report.json'); console.log('## Enrichment '+r.run_id+'\\n\\n- Status: '+r.status+'\\n- Phase: '+r.phase+'\\n- Primary cursor: '+r.primary_cursor+'/'+r.manifest.length+'\\n- Retry cursor: '+r.retry_cursor+'/'+r.retry_queue.length)" >> "$GITHUB_STEP_SUMMARY"
          fi
