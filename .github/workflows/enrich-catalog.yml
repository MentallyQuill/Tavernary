name: "Catalog maintenance: Enrich project metadata"
run-name: "Automation prepare ${{ inputs.operation_key }}"

on:
  workflow_dispatch:
    inputs:
      operation_key:
        description: Immutable reconciled enrichment checkpoint.
        type: string
        required: true
      budget_ticket:
        description: Writer-reserved allowance; empty only when no model work is needed.
        type: string
        required: false
        default: ""

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

concurrency:
  group: catalog-enrichment-preparation
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      inputs.operation_key != '' &&
      github.ref == 'refs/heads/main' &&
      github.actor_id == vars.TAVERNARY_PUBLISHER_BOT_ID
    runs-on: ubuntu-latest
    environment: publisher
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: read
    steps:
      - name: Check out pinned trusted preparation code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Prepare one operation with reserved model allowance
        id: prepare
        run: node scripts/automation/catalog-preparation-cli.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAVERNARY_PUBLISHER_BOT_ID: ${{ vars.TAVERNARY_PUBLISHER_BOT_ID }}
          TAVERNARY_REQUIRE_MODEL_BUDGET: "true"
          UTILITY_API_ENDPOINT: ${{ secrets.UTILITY_API_ENDPOINT }}
          UTILITY_API_KEY: ${{ secrets.UTILITY_API_KEY }}
          UTILITY_MODEL: ${{ secrets.UTILITY_MODEL }}
          UTILITY_REASONING_EFFORT: ${{ vars.UTILITY_REASONING_EFFORT }}
          TAVERNARY_ENRICHMENT_API_URL: ${{ secrets.TAVERNARY_ENRICHMENT_API_URL }}
          TAVERNARY_ENRICHMENT_API_KEY: ${{ secrets.TAVERNARY_ENRICHMENT_API_KEY }}
          TAVERNARY_ENRICHMENT_MODEL: ${{ secrets.TAVERNARY_ENRICHMENT_MODEL }}
      - name: Retain immutable data result for the shared writer
        if: steps.prepare.outputs.result_available == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: automation-prepared-${{ inputs.operation_key }}
          path: ${{ runner.temp }}/automation-prepared/result.json
          if-no-files-found: error
          retention-days: 90
      - name: Retain safe preparation failure diagnostic
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: automation-failure-${{ inputs.operation_key }}-${{ github.run_id }}
          path: ${{ runner.temp }}/automation-prepared/diagnostic.json
          if-no-files-found: ignore
          retention-days: 90
