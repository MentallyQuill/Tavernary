name: "Project owner requests: Create review PR"
run-name: "Owner request #${{ inputs.issue_number }}: Create review PR"

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Project owner request issue number
        required: true
        type: number
      force_regeneration:
        description: Retry generation without overriding maintainer changes
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

concurrency:
  group: project-owner-generation
  cancel-in-progress: false

jobs:
  generate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      ISSUE_NUMBER: ${{ inputs.issue_number }}
      FORCE_REGENERATION: ${{ inputs.force_regeneration }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAVERNARY_ENRICHMENT_API_URL: ${{ secrets.TAVERNARY_ENRICHMENT_API_URL }}
      TAVERNARY_ENRICHMENT_API_KEY: ${{ secrets.TAVERNARY_ENRICHMENT_API_KEY }}
      TAVERNARY_ENRICHMENT_MODEL: ${{ secrets.TAVERNARY_ENRICHMENT_MODEL }}
    steps:
      - name: Check out full current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install repository dependencies
        run: npm ci
      - name: Inspect exact existing owner state
        id: state
        shell: bash
        run: |
          set -euo pipefail
          branch="automation/project-owner-request-${ISSUE_NUMBER}"
          issue_path="${RUNNER_TEMP}/project-owner-issue.json"
          pr_path="${RUNNER_TEMP}/project-owner-pr.json"
          gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}" > "$issue_path"
          node --input-type=module -e "
            import fs from 'node:fs';
            const issue = JSON.parse(fs.readFileSync(process.argv[1], 'utf8'));
            const labels = issue.labels.map((label) => label.name);
            if (issue.state !== 'open' ||
                !labels.includes('issue-admitted') ||
                !labels.includes('project-owner-request') ||
                (!labels.includes('needs-maintainer-review') &&
                 !labels.includes('submission-pr-open') &&
                 !labels.includes('submission-retryable'))) {
              throw new Error('Owner request issue is no longer admitted.');
            }
          " "$issue_path"
          gh api --method GET "repos/${GITHUB_REPOSITORY}/pulls" \
            -f state=open \
            -f head="${GITHUB_REPOSITORY_OWNER}:${branch}" \
            -f base=main \
            -f per_page=2 > "$pr_path"
          remote_sha="$(git ls-remote --heads origin "refs/heads/$branch" | awk '{print $1}')"
          node --input-type=module -e "
            import fs from 'node:fs';
            import { parseOwnerRequestPullRequestMarker } from './scripts/help/project-owner-pr.mjs';
            const pull = JSON.parse(fs.readFileSync(process.argv[1], 'utf8'))[0] ?? null;
            const marker = pull
              ? parseOwnerRequestPullRequestMarker(pull.body ?? '')
              : null;
            if (pull && !marker) {
              throw new Error('Existing owner branch PR has no valid owner marker.');
            }
            fs.writeFileSync(
              process.env.RUNNER_TEMP + '/previous-owner-paths.txt',
              (marker?.generated_paths ?? []).join('\n'),
            );
            fs.appendFileSync(process.env.GITHUB_OUTPUT, [
              'pr_number=' + (pull?.number ?? ''),
              'marker_sha=' + (marker?.generated_head_sha ?? ''),
            ].join('\n') + '\n');
          " "$pr_path"
          {
            echo "branch=$branch"
            echo "remote_sha=$remote_sha"
          } >> "$GITHUB_OUTPUT"
      - name: Refuse unowned or maintainer-diverged branches
        shell: bash
        env:
          PR_NUMBER: ${{ steps.state.outputs.pr_number }}
          MARKER_SHA: ${{ steps.state.outputs.marker_sha }}
          REMOTE_SHA: ${{ steps.state.outputs.remote_sha }}
        run: |
          set -euo pipefail
          if [[ -n "$REMOTE_SHA" && -z "$PR_NUMBER" ]]; then
            echo "::error::Owner request branch exists without an open marked PR."
            exit 1
          fi
          if [[ -n "$PR_NUMBER" &&
                ( -z "$REMOTE_SHA" || -z "$MARKER_SHA" ||
                  "$REMOTE_SHA" != "$MARKER_SHA" ) ]]; then
            echo "::error::Owner request branch contains maintainer divergence; regeneration is refused."
            exit 1
          fi
      - name: Generate from latest main and issue state
        shell: bash
        env:
          BRANCH: ${{ steps.state.outputs.branch }}
          PR_NUMBER: ${{ steps.state.outputs.pr_number }}
          REMOTE_SHA: ${{ steps.state.outputs.remote_sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$PR_NUMBER" ]]; then
            git fetch origin "refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
            git rebase origin/main
            while IFS= read -r generated_path; do
              [[ -z "$generated_path" ]] && continue
              case "$generated_path" in
                data/registry/projects/*.json|data/registry/sources/*.json|data/snapshots/github/*.json|data/snapshots/codeberg/*.json) ;;
                *)
                  echo "::error::Refusing unsafe previous owner path: $generated_path"
                  exit 1
                  ;;
              esac
              if git cat-file -e "origin/main:${generated_path}" 2>/dev/null; then
                git checkout origin/main -- "$generated_path"
              else
                rm -f -- "$generated_path"
              fi
            done < "${RUNNER_TEMP}/previous-owner-paths.txt"
          else
            git checkout -B "$BRANCH" origin/main
          fi
          node scripts/help/generate-project-owner-request.mjs \
            --issue-number "$ISSUE_NUMBER" \
            --output-directory "$GITHUB_WORKSPACE" \
            --report-path "${RUNNER_TEMP}/project-owner-generation-report.json"
      - name: Prepare and verify exact operation paths
        id: paths
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const report = JSON.parse(
            fs.readFileSync(
              `${process.env.RUNNER_TEMP}/project-owner-generation-report.json`,
              "utf8",
            ),
          );
          const cardPaths = report.project_ids.map(
            (projectId) => `data/registry/projects/${projectId}.json`,
          );
          const sourcePath = `data/registry/sources/${report.source_id}.json`;
          const snapshotPath = `data/snapshots/github/${report.source_id}.json`;
          const expected = ["edit-card", "add-cards", "retire-card", "restore-card"]
            .includes(report.operation)
            ? cardPaths
            : report.operation === "move-source"
              ? [sourcePath, snapshotPath]
              : report.operation === "delist-source"
                ? [sourcePath]
                : [];
          if (
            report.schema_version !== 2 ||
            !Array.isArray(report.generated_paths) ||
            expected.length === 0 ||
            JSON.stringify(report.generated_paths) !== JSON.stringify(expected)
          ) {
            throw new Error("Owner generator returned paths outside the exact operation.");
          }
          fs.writeFileSync(
            `${process.env.RUNNER_TEMP}/owner-generated-paths.txt`,
            expected.join("\n"),
          );
          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `project_label=${report.project_ids.join(",") || report.source_id}\noperation=${report.operation}\nsource_id=${report.source_id}\n`,
          );
          NODE
          {
            git diff --no-renames --name-only -z
            git ls-files --others --exclude-standard -z
          } > "${RUNNER_TEMP}/owner-dirty-paths.bin"
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const allowed = new Set(
            fs.readFileSync(`${process.env.RUNNER_TEMP}/owner-generated-paths.txt`, "utf8")
              .split(/\r?\n/u).filter(Boolean),
          );
          const dirty = fs.readFileSync(
            `${process.env.RUNNER_TEMP}/owner-dirty-paths.bin`,
          ).toString("utf8").split("\0").filter(Boolean);
          const unsafe = dirty.filter((path) => !allowed.has(path));
          if (unsafe.length > 0) {
            throw new Error(`Owner generation changed unsafe paths: ${unsafe.join(", ")}`);
          }
          NODE
      - name: Validate owner proposal and content build
        shell: bash
        run: |
          set -euo pipefail
          npm run catalog:validate
          npm run catalog:build
          npm test -- \
            tests/unit/trusted-editor-authority.test.ts \
            tests/unit/catalog-copy-provider.test.ts \
            tests/unit/catalog-copy-contract.test.ts \
            tests/unit/project-owner-authority.test.ts \
            tests/unit/apply-project-owner-request.test.ts \
            tests/unit/triage-project-owner-request.test.ts \
            tests/unit/generate-project-owner-request.test.ts \
            tests/unit/project-owner-pr.test.ts \
            tests/unit/project-owner-lifecycle.test.ts
          npm run check:content
          git clean -fX -- src/generated/catalog.json
          {
            git diff --no-renames --name-only -z
            git ls-files --others --exclude-standard -z
          } > "${RUNNER_TEMP}/owner-validated-paths.bin"
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import fs from "node:fs";
          const allowed = new Set(
            fs.readFileSync(`${process.env.RUNNER_TEMP}/owner-generated-paths.txt`, "utf8")
              .split(/\r?\n/u).filter(Boolean),
          );
          const dirty = fs.readFileSync(
            `${process.env.RUNNER_TEMP}/owner-validated-paths.bin`,
          ).toString("utf8").split("\0").filter(Boolean);
          const unsafe = dirty.filter((path) => !allowed.has(path));
          if (unsafe.length > 0) {
            throw new Error(`Validation left unsafe owner paths: ${unsafe.join(", ")}`);
          }
          const reportPath =
            `${process.env.RUNNER_TEMP}/project-owner-generation-report.json`;
          const report = JSON.parse(fs.readFileSync(reportPath, "utf8"));
          const hashes = Object.fromEntries(
            report.generated_paths.map((path) => [
              path,
              createHash("sha256").update(fs.readFileSync(path)).digest("hex"),
            ]),
          );
          fs.copyFileSync(
            reportPath,
            `${process.env.RUNNER_TEMP}/validated-project-owner-report.json`,
          );
          fs.writeFileSync(
            `${process.env.RUNNER_TEMP}/validated-project-owner-report.sha256`,
            createHash("sha256")
              .update(fs.readFileSync(reportPath))
              .digest("hex"),
          );
          fs.writeFileSync(
            `${process.env.RUNNER_TEMP}/validated-project-owner-hashes.json`,
            JSON.stringify(hashes),
          );
          NODE
      - name: Reject conflicting open owner paths
        shell: bash
        run: |
          set -euo pipefail
          pulls_path="${RUNNER_TEMP}/open-owner-pr-pages.json"
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" \
            > "$pulls_path"
          node --input-type=module -e "
            import fs from 'node:fs';
            import { findOwnerRequestPathCollision } from './scripts/help/project-owner-pr.mjs';
            const pages = JSON.parse(fs.readFileSync(process.argv[1], 'utf8'));
            const generatedPaths = fs.readFileSync(process.argv[2], 'utf8')
              .split(/\r?\n/u).filter(Boolean);
            const collision = findOwnerRequestPathCollision({
              repository: process.env.GITHUB_REPOSITORY,
              issueNumber: Number(process.env.ISSUE_NUMBER),
              generatedPaths,
              pulls: pages.flat(),
            });
            if (collision) {
              throw new Error(
                'Owner paths already belong to issue #' + collision.issueNumber +
                ' and PR #' + collision.prNumber + ': ' + collision.prUrl,
              );
            }
          " "$pulls_path" "${RUNNER_TEMP}/owner-generated-paths.txt"
      - name: Regenerate final owner state before branch mutation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo "::error::Main advanced during owner validation; rerun against current main."
            exit 1
          fi
          mapfile -t generated_paths < "${RUNNER_TEMP}/owner-generated-paths.txt"
          for generated_path in "${generated_paths[@]}"; do
            if git cat-file -e "origin/main:${generated_path}" 2>/dev/null; then
              git checkout origin/main -- "$generated_path"
            else
              rm -f -- "$generated_path"
            fi
          done
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import fs from "node:fs";
          const reportPath =
            `${process.env.RUNNER_TEMP}/validated-project-owner-report.json`;
          const expected = fs.readFileSync(
            `${process.env.RUNNER_TEMP}/validated-project-owner-report.sha256`,
            "utf8",
          );
          const actual = createHash("sha256")
            .update(fs.readFileSync(reportPath))
            .digest("hex");
          if (actual !== expected) {
            throw new Error(
              "Validated owner report changed after content validation.",
            );
          }
          NODE
          node scripts/help/generate-project-owner-request.mjs \
            --issue-number "$ISSUE_NUMBER" \
            --output-directory "$GITHUB_WORKSPACE" \
            --report-path "${RUNNER_TEMP}/project-owner-generation-report.json" \
            --validated-report-path "${RUNNER_TEMP}/validated-project-owner-report.json"
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import fs from "node:fs";
          import { sameProjectOwnerGenerationReport } from "./scripts/help/generate-project-owner-request.mjs";
          const validated = JSON.parse(
            fs.readFileSync(
              `${process.env.RUNNER_TEMP}/validated-project-owner-report.json`,
              "utf8",
            ),
          );
          const regenerated = JSON.parse(
            fs.readFileSync(
              `${process.env.RUNNER_TEMP}/project-owner-generation-report.json`,
              "utf8",
            ),
          );
          const validatedHashes = JSON.parse(
            fs.readFileSync(
              `${process.env.RUNNER_TEMP}/validated-project-owner-hashes.json`,
              "utf8",
            ),
          );
          const regeneratedHashes = Object.fromEntries(
            regenerated.generated_paths.map((path) => [
              path,
              createHash("sha256").update(fs.readFileSync(path)).digest("hex"),
            ]),
          );
          if (
            !sameProjectOwnerGenerationReport(validated, regenerated) ||
            JSON.stringify(validatedHashes) !== JSON.stringify(regeneratedHashes)
          ) {
            throw new Error(
              "Owner request changed after validation; refusing stale generation.",
            );
          }
          NODE
      - name: Plan safe owner branch update
        id: plan
        shell: bash
        env:
          PR_NUMBER: ${{ steps.state.outputs.pr_number }}
          REMOTE_SHA: ${{ steps.state.outputs.remote_sha }}
          MARKER_SHA: ${{ steps.state.outputs.marker_sha }}
        run: |
          set -euo pipefail
          mapfile -t generated_paths < "${RUNNER_TEMP}/owner-generated-paths.txt"
          if [[ -z "$(git status --porcelain=v1 -- "${generated_paths[@]}")" ]]; then
            changed=false
          else
            changed=true
          fi
          CHANGED="$changed" node --input-type=module <<'NODE'
          import fs from "node:fs";
          import {
            parseOwnerRequestPullRequestMarker,
            planOwnerPrUpdate,
          } from "./scripts/help/project-owner-pr.mjs";
          const report = JSON.parse(
            fs.readFileSync(
              `${process.env.RUNNER_TEMP}/project-owner-generation-report.json`,
              "utf8",
            ),
          );
          const pulls = JSON.parse(
            fs.readFileSync(`${process.env.RUNNER_TEMP}/open-owner-pr-pages.json`, "utf8"),
          ).flat();
          const existingPull = JSON.parse(
            fs.readFileSync(`${process.env.RUNNER_TEMP}/project-owner-pr.json`, "utf8"),
          )[0] ?? null;
          const marker = existingPull
            ? parseOwnerRequestPullRequestMarker(existingPull.body ?? "")
            : null;
          const plan = planOwnerPrUpdate({
            report,
            repository: process.env.GITHUB_REPOSITORY,
            remoteHeadSha: process.env.REMOTE_SHA || null,
            existingMarker: marker ? { kind: "project-owner", marker } : null,
            generatedContentChanged: process.env.CHANGED === "true",
            pulls,
          });
          if (plan.action === "conflict") throw new Error(plan.message);
          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `action=${plan.action}\nhas_pr=${Boolean(existingPull)}\n`,
          );
          NODE
      - name: Commit and push exact owner paths
        id: commit
        if: steps.plan.outputs.action != 'noop'
        shell: bash
        env:
          BRANCH: ${{ steps.state.outputs.branch }}
          REMOTE_SHA: ${{ steps.state.outputs.remote_sha }}
        run: |
          set -euo pipefail
          mapfile -t generated_paths < "${RUNNER_TEMP}/owner-generated-paths.txt"
          git add -- "${generated_paths[@]}"
          git diff --cached --name-only -z > "${RUNNER_TEMP}/owner-staged-paths.bin"
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const expected = fs.readFileSync(
            `${process.env.RUNNER_TEMP}/owner-generated-paths.txt`,
            "utf8",
          ).split(/\r?\n/u).filter(Boolean).sort();
          const staged = fs.readFileSync(
            `${process.env.RUNNER_TEMP}/owner-staged-paths.bin`,
          ).toString("utf8").split("\0").filter(Boolean).sort();
          if (JSON.stringify(staged) !== JSON.stringify(expected)) {
            throw new Error("Refusing to stage anything except the exact owner operation paths.");
          }
          NODE
          git commit -m "feat(catalog): apply owner request #${ISSUE_NUMBER}"
          head_sha="$(git rev-parse HEAD)"
          if [[ -z "$REMOTE_SHA" ]]; then
            git push origin "HEAD:refs/heads/$BRANCH"
          else
            git push --force-with-lease="refs/heads/$BRANCH:$REMOTE_SHA" \
              origin "HEAD:refs/heads/$BRANCH"
          fi
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
      - name: Create or update owner review PR
        if: steps.plan.outputs.action != 'noop'
        shell: bash
        env:
          BRANCH: ${{ steps.state.outputs.branch }}
          HEAD_SHA: ${{ steps.commit.outputs.head_sha }}
          PR_NUMBER: ${{ steps.state.outputs.pr_number }}
          PROJECT_LABEL: ${{ steps.paths.outputs.project_label }}
          REMOTE_SHA: ${{ steps.state.outputs.remote_sha }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { execFileSync } from "node:child_process";
          import { createProjectPublicationTransaction } from "./scripts/publication/project-publication-transaction.mjs";
          import { renderOwnerRequestPullRequest } from "./scripts/help/project-owner-pr.mjs";
          const report = JSON.parse(
            fs.readFileSync(
              `${process.env.RUNNER_TEMP}/project-owner-generation-report.json`,
              "utf8",
            ),
          );
          const transaction = createProjectPublicationTransaction({
            schema_version: 2,
            operation: report.operation,
            producer: "project-owner-request",
            publication_mode: report.publication_mode,
            issue_number: Number(process.env.ISSUE_NUMBER),
            project_ids: report.project_ids,
            source_id: report.source_id,
            source_identity: report.source_identity,
            actor: {
              id: report.actor_id,
              login: report.actor_login,
              type: report.actor_type,
            },
            authority_type: report.authority_type,
            input_digest: report.request_fingerprint,
            input_fingerprints: report.input_fingerprints,
            base_sha: execFileSync(
              "git",
              ["rev-parse", "origin/main"],
              { encoding: "utf8" },
            ).trim(),
            generated_head_sha:
              process.env.HEAD_SHA || process.env.REMOTE_SHA,
            generated_paths: report.generated_paths,
            policy_version: report.policy_version,
            copy_result: report.copy_result
              ? { mode: report.copy_mode, ...report.copy_result }
              : null,
          });
          const body = renderOwnerRequestPullRequest({
            issueNumber: Number(process.env.ISSUE_NUMBER),
            projectName: report.project_ids.join(", ") || report.source_id,
            report,
            marker: transaction,
          });
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/project-owner-pr.md`, body);
          NODE
          title="[Project owner request] ${PROJECT_LABEL}"
          if [[ -n "$PR_NUMBER" ]]; then
            gh pr edit "$PR_NUMBER" --title "$title" \
              --body-file "${RUNNER_TEMP}/project-owner-pr.md"
          else
            gh pr create --base main --head "$BRANCH" --title "$title" \
              --body-file "${RUNNER_TEMP}/project-owner-pr.md"
          fi
      - name: Synchronize owner issue review state
        if: steps.plan.outputs.action != 'noop' || steps.plan.outputs.has_pr == 'true'
        shell: bash
        run: |
          set -euo pipefail
          gh label create submission-pr-open \
            --color 5319e7 \
            --description "Submission has an open generated maintainer-review PR." \
            --force
          issue_path="${RUNNER_TEMP}/project-owner-current-issue.json"
          labels_path="${RUNNER_TEMP}/project-owner-review-labels.json"
          gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}" > "$issue_path"
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const issue = JSON.parse(
            fs.readFileSync(`${process.env.RUNNER_TEMP}/project-owner-current-issue.json`, "utf8"),
          );
          const labels = issue.labels.map((label) => label.name);
          if (
            issue.state !== "open" ||
            !labels.includes("issue-admitted") ||
            !labels.includes("project-owner-request")
          ) {
            throw new Error("Owner request issue is no longer admitted.");
          }
          const owned = new Set([
            "needs-information",
            "needs-maintainer-review",
            "submission-retryable",
            "submission-pr-open",
            "submission-declined",
          ]);
          const next = labels.filter((label) => !owned.has(label));
          next.push("submission-pr-open");
          fs.writeFileSync(
            `${process.env.RUNNER_TEMP}/project-owner-review-labels.json`,
            JSON.stringify({ labels: [...new Set(next)] }),
          );
          NODE
          gh api --method PUT \
            "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/labels" \
            --input "$labels_path"
      - name: Upload sanitized owner generation report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: project-owner-request-${{ inputs.issue_number }}-generation
          path: ${{ runner.temp }}/project-owner-generation-report.json
          if-no-files-found: error
      - name: Dispatch CI for generated owner branch
        if: steps.plan.outputs.action != 'noop'
        env:
          BRANCH: ${{ steps.state.outputs.branch }}
        run: gh workflow run ci.yml --ref "$BRANCH"
      - name: Reconcile failed generation
        if: failure() && !cancelled()
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          GENERATION_PRODUCER: project-owner-request
          GENERATION_REASON_CODE: generation-failed
          GENERATION_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/submissions/project-generation-failure.mjs
