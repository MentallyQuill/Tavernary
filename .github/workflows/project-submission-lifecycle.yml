name: "Project submissions: Process review result"
run-name: "Project review PR #${{ github.event.pull_request.number }}: Process result"

on:
  pull_request:
    types:
      - closed

permissions:
  contents: write
  issues: write
  pull-requests: read

concurrency:
  group: project-submission-lifecycle-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  close:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out default-branch lifecycle code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Plan generated submission closure
        id: plan
        shell: bash
        env:
          CLOSED_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          node --input-type=module -e "
            import fs from 'node:fs';
            import { planProjectSubmissionClosure } from './scripts/submissions/project-submission-lifecycle.mjs';
            const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
            const pull = event.pull_request;
            const plan = planProjectSubmissionClosure({
              merged: pull.merged === true,
              headRef: pull.head.ref,
              headRepository: pull.head.repo?.full_name ?? '',
              baseRepository: event.repository.full_name,
              body: pull.body ?? '',
            });
            fs.writeFileSync(process.env.RUNNER_TEMP + '/project-submission-closure.json', JSON.stringify(plan));
            fs.appendFileSync(process.env.GITHUB_OUTPUT, [
              'action=' + plan.action,
              'issue_number=' + (plan.issueNumber ?? ''),
              'branch=' + (plan.deleteBranch ?? ''),
              'head_sha=' + process.env.CLOSED_PR_HEAD_SHA,
              'pr_number=' + pull.number,
              'pr_url=' + pull.html_url,
            ].join('\n') + '\n');
          "
      - name: Synchronize issue lifecycle
        if: steps.plan.outputs.action != 'ignore'
        shell: bash
        env:
          ACTION: ${{ steps.plan.outputs.action }}
          ISSUE_NUMBER: ${{ steps.plan.outputs.issue_number }}
          PR_NUMBER: ${{ steps.plan.outputs.pr_number }}
          PR_URL: ${{ steps.plan.outputs.pr_url }}
        run: |
          set -euo pipefail
          issue_path="${RUNNER_TEMP}/project-submission-lifecycle-issue.json"
          labels_path="${RUNNER_TEMP}/project-submission-lifecycle-labels.json"
          gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}" > "$issue_path"
          node --input-type=module -e "
            import fs from 'node:fs';
            const issue = JSON.parse(fs.readFileSync(process.argv[1], 'utf8'));
            const plan = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/project-submission-closure.json', 'utf8'));
            const removed = new Set(plan.removeLabels ?? []);
            const labels = issue.labels.map((label) => label.name).filter((label) => !removed.has(label));
            labels.push(...(plan.addLabels ?? []));
            fs.writeFileSync(process.argv[2], JSON.stringify({ labels: [...new Set(labels)] }));
          " "$issue_path" "$labels_path"
          gh api --method PUT \
            "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/labels" \
            --input "$labels_path"
          if [[ "$ACTION" == "decline" ]]; then
            marker="<!-- tavernary-project-submission-declined-pr:${PR_NUMBER} -->"
            existing_id="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
              --jq ".[] | select(.body | contains(\"$marker\")) | .id" | head -n 1)"
            if [[ -z "$existing_id" ]]; then
              comment_path="${RUNNER_TEMP}/project-submission-declined-comment.json"
              node -e "
                require('fs').writeFileSync(
                  process.argv[1],
                  JSON.stringify({ body: process.argv[2] + '\nSubmission declined when the generated review PR was closed without merging: ' + process.argv[3] }),
                );
              " "$comment_path" "$marker" "$PR_URL"
              gh api --method POST \
                "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
                --input "$comment_path"
            fi
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}" \
              -f state=closed \
              -f state_reason=not_planned
          fi
      - name: Delete unchanged generated branch
        if: steps.plan.outputs.action != 'ignore'
        shell: bash
        env:
          BRANCH: ${{ steps.plan.outputs.branch }}
          EXPECTED_SHA: ${{ steps.plan.outputs.head_sha }}
        run: |
          set -euo pipefail
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${BRANCH}" --jq '.object.sha' 2>/dev/null || true)"
          if [[ -n "$current_sha" && "$current_sha" == "$EXPECTED_SHA" ]]; then
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}"
          else
            echo "Generated branch moved after PR closure; leaving it intact."
          fi
