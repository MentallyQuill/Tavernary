name: "Support transparency: Publish OpenAI usage"

run-name: "Support: Publish prior-month usage"

on:
  schedule:
    - cron: "23 7 2 * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: support-usage-publication
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_dispatch' ||
      github.actor_id == 2625904 ||
      github.actor_id == 41898282)
    runs-on: ubuntu-latest
    environment: publisher
    steps:
      - name: Create Tavernary Publisher token
        id: publisher-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.TAVERNARY_PUBLISHER_APP_ID }}
          private-key: ${{ secrets.TAVERNARY_PUBLISHER_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: main
          token: ${{ steps.publisher-token.outputs.token }}
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Refresh prior-month aggregate usage
        env:
          OPENAI_ADMIN_KEY: ${{ secrets.OPENAI_ADMIN_KEY }}
          OPENAI_PROJECT_ID: ${{ secrets.OPENAI_PROJECT_ID }}
        run: npm run support:refresh-usage
      - name: Validate support snapshot and site
        run: npm run check
      - name: Commit and publish aggregate usage
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git add -- data/support/monthly-usage.json
          if git diff --cached --quiet -- data/support/monthly-usage.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(support): publish monthly OpenAI usage"

          for attempt in 1 2 3; do
            if git fetch --no-tags origin main &&
              git rebase origin/main &&
              npm run check &&
              git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git rebase --abort || true
            if (( attempt == 3 )); then
              exit 1
            fi
          done
      - name: Deploy the published usage snapshot
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ steps.commit.outputs.sha }}
        run: >-
          gh workflow run deploy-pages.yml --repo "$GITHUB_REPOSITORY"
          --ref main -f source_sha="$SOURCE_SHA"
