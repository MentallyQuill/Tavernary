name: "Site: Deploy to GitHub Pages"

run-name: "Site: Deploy ${{ inputs.source_sha || github.sha }}"

on:
  push:
    branches:
      - main
    paths-ignore:
      - "data/reports/**"
      - "data/snapshots/policy-review/**"
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact checkpoint commit to deploy
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    env:
      TAVERNARY_BASE_PATH: ""
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Validate exact deployment source
        if: ${{ inputs.source_sha != '' }}
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Deployment source must be a full lowercase commit SHA." >&2
            exit 1
          fi
          git fetch --no-tags origin main
          git cat-file -e "$SOURCE_SHA^{commit}"
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          git checkout --detach "$SOURCE_SHA"
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate, test, and build
        run: npm run check
      - name: Verify static export
        run: npm run verify:export
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Upload static export
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
