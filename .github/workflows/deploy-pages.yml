name: "Site: Deploy to GitHub Pages"

run-name: "Site: Deploy ${{ inputs.source_sha || github.sha }}"

on:
  push:
    branches:
      - main
    paths-ignore:
      - "data/reports/**"
      - "data/snapshots/policy-review/**"
      - "data/maintenance/automation/**"
      - "docs/**"
      - "tests/**"
      - "README.md"
      - "AGENTS.md"
      - "CLAUDE.md"
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact checkpoint commit to deploy
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    env:
      TAVERNARY_BASE_PATH: ""
      TAVERNARY_TARGET_MANIFEST_URL: https://tavernary.org/security/tavernkeeper-targets.json
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      source_sha: ${{ steps.revision.outputs.source_sha }}
      prior_target_digest: ${{ steps.target-manifest.outputs.prior_digest }}
      built_target_digest: ${{ steps.target-manifest.outputs.built_digest }}
      targets_changed: ${{ steps.target-manifest.outputs.changed }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate exact deployment source
        if: ${{ inputs.source_sha != '' }}
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Deployment source must be a full lowercase commit SHA." >&2
            exit 1
          fi
          git fetch --no-tags origin main
          git cat-file -e "$SOURCE_SHA^{commit}"
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          git checkout --detach "$SOURCE_SHA"
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate, test, and build
        run: npm run check
      - name: Bind the complete export to its exact revision
        id: revision
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          node scripts/automation/revision-manifest.mjs write "$source_sha" "run-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
      - name: Compare public and built TavernKeeper targets
        id: target-manifest
        shell: bash
        run: |
          set -euo pipefail
          built_digest="$(node scripts/security/tavernkeeper-publication.mjs digest out/security/tavernkeeper-targets.json)"
          prior_digest=""

          set +e
          prior_digest="$(node scripts/security/tavernkeeper-publication.mjs read "$TAVERNARY_TARGET_MANIFEST_URL")"
          read_status=$?
          set -e
          if (( read_status != 0 )); then
            echo "::notice::Previous hosted manifest unavailable or invalid; treating this deployment as changed."
            prior_digest=""
          fi

          changed=false
          if [[ -z "$prior_digest" || "$prior_digest" != "$built_digest" ]]; then
            changed=true
          fi
          echo "prior_digest=$prior_digest" >> "$GITHUB_OUTPUT"
          echo "built_digest=$built_digest" >> "$GITHUB_OUTPUT"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
      - name: Verify static export
        env:
          TAVERNARY_EXPECTED_SOURCE_SHA: ${{ steps.revision.outputs.source_sha }}
          TAVERNARY_EXPECTED_BUILD_ID: run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
        run: npm run verify:export
      - name: Retain revision integrity metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-revision-${{ steps.revision.outputs.source_sha }}
          path: out/revision.json
          retention-days: 90
          if-no-files-found: error
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Upload static export
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    outputs:
      action: ${{ steps.guard.outputs.action }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out trusted deployment controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install controller dependencies
        run: npm ci
      - name: Read this run's exact revision metadata
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "site-revision-$SOURCE_SHA" --dir .tmp/site-revision
      - name: Recheck fresh main and confirmed deployment ancestry
        id: guard
        env:
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          node scripts/automation/deployment-gate.mjs .tmp/site-revision/revision.json "$SOURCE_SHA"
      - name: Deploy GitHub Pages
        if: steps.guard.outputs.action == 'deploy'
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  confirm-public:
    needs: [build, deploy]
    if: needs.deploy.outputs.action == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out trusted public verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install verifier dependencies
        run: npm ci
      - name: Install public verification browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Read this run's exact revision metadata
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "site-revision-$SOURCE_SHA" --dir .tmp/site-revision
      - name: Confirm public revision, assets, and essential browser behavior
        run: node scripts/automation/confirm-deployment.mjs .tmp/site-revision/revision.json .tmp/confirmation.json
      - name: Retain public verification result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-confirmation-${{ needs.build.outputs.source_sha }}
          path: .tmp/confirmation.json
          retention-days: 90
          if-no-files-found: warn

  wake-tavernkeeper:
    needs:
      - build
      - deploy
    if: needs.build.outputs.targets_changed == 'true' && needs.deploy.outputs.action == 'deploy'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAVERNARY_TARGET_MANIFEST_URL: https://tavernary.org/security/tavernkeeper-targets.json
      BUILT_TARGET_DIGEST: ${{ needs.build.outputs.built_target_digest }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Wait for the exact public TavernKeeper targets
        id: public-target
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..20}; do
            if node scripts/security/tavernkeeper-publication.mjs verify \
              "$TAVERNARY_TARGET_MANIFEST_URL" "$BUILT_TARGET_DIGEST"; then
              echo "verified=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 15
          done
          echo "The deployed TavernKeeper target manifest never matched the built digest." >&2
          exit 1
      - name: Create destination-only TavernKeeper token
        id: tavernkeeper-token
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.TAVERNKEEPER_WAKE_APP_ID }}
          private-key: ${{ secrets.TAVERNKEEPER_WAKE_APP_PRIVATE_KEY }}
          owner: MentallyQuill
          repositories: TavernKeeper
          permission-actions: write
      - name: Warn when TavernKeeper token creation fails
        if: steps.tavernkeeper-token.outcome != 'success'
        run: >-
          echo "::warning::TavernKeeper wake token creation failed after a verified deployment;
          scheduled reconciliation remains active."
      - name: Wake TavernKeeper reconciliation (best effort)
        if: >-
          steps.public-target.outputs.verified == 'true' &&
          steps.tavernkeeper-token.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.tavernkeeper-token.outputs.token }}
        shell: bash
        run: |
          if ! gh api --method POST \
            repos/MentallyQuill/TavernKeeper/actions/workflows/reconcile.yml/dispatches \
            -f ref=main; then
            echo "::warning::TavernKeeper wake failed after a verified deployment; scheduled reconciliation remains active."
          fi
