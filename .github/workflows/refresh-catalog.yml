name: Refresh catalog

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Refresh every automatic source or one backfill batch.
        type: choice
        options:
          - incremental
          - backfill
        default: incremental
      start_index:
        description: Zero-based first record for backfill mode.
        type: number
        default: 0
      batch_size:
        description: Number of records for backfill mode.
        type: number
        default: 20
      project_id:
        description: Optional single production project ID.
        type: string
        required: false

permissions:
  contents: write
  actions: write

concurrency:
  group: catalog-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Refresh selected sources
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: ${{ inputs.mode || 'incremental' }}
          START_INDEX: ${{ inputs.start_index || 0 }}
          BATCH_SIZE: ${{ inputs.batch_size || 20 }}
          PROJECT_ID: ${{ inputs.project_id || '' }}
        run: |
          args=(--mode "$MODE" --start-index "$START_INDEX" --batch-size "$BATCH_SIZE")
          if [[ -n "$PROJECT_ID" ]]; then
            args+=(--project-id "$PROJECT_ID")
          fi
          npm run catalog:refresh -- "${args[@]}"
      - name: Validate refreshed catalog
        run: npm run check
      - name: Commit snapshot changes
        id: commit
        shell: bash
        run: |
          git add data/snapshots/github/*.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(catalog): refresh GitHub snapshots"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Redeploy refreshed catalog
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-pages.yml --ref main
      - name: Advance backfill queue
        if: ${{ success() && inputs.mode == 'backfill' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          START_INDEX: ${{ inputs.start_index || 0 }}
          BATCH_SIZE: ${{ inputs.batch_size || 20 }}
        shell: bash
        run: |
          next_index=$((START_INDEX + BATCH_SIZE))
          if (( next_index < 200 )); then
            gh workflow run refresh-catalog.yml \
              --ref main \
              -f mode=backfill \
              -f start_index="$next_index" \
              -f batch_size="$BATCH_SIZE"
          else
            echo "Backfill queue complete at index $next_index."
          fi
