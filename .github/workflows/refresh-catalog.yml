name: "Catalog maintenance: Refresh source data"

run-name: >-
  ${{ inputs.operation_key
    && format('Automation prepare {0}', inputs.operation_key)
    || github.event_name == 'schedule'
    && 'Catalog: Refresh scheduled incremental'
    || inputs.mode == 'baseline'
    && format('Catalog: Refresh baseline queue (up to {0} sources)', inputs.batch_size)
    || inputs.source_id
    && format('Catalog: Refresh {0} source {1}', inputs.mode, inputs.source_id)
    || format('Catalog: Refresh {0}', inputs.mode) }}

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      operation_key:
        description: Immutable operation selected by the reconciler; empty for an owner request.
        type: string
        required: false
        default: ""
      mode:
        description: Select incremental observation, baseline queue, or one source.
        type: choice
        options:
          - incremental
          - baseline
          - project
          - forensic
        default: incremental
      batch_size:
        description: Number of provisional sources for baseline mode (1-24).
        type: number
        default: 12
      source_id:
        description: Required source ID for project or forensic mode.
        type: string
        required: false

permissions:
  contents: read
  actions: read
  issues: read

concurrency:
  group: catalog-refresh-${{ inputs.operation_key || 'request' }}
  cancel-in-progress: false

jobs:
  refresh:
    if: >-
      inputs.operation_key == '' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_dispatch' ||
      github.actor_id == 2625904 ||
      github.actor_id == vars.TAVERNARY_PUBLISHER_BOT_ID)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: publisher
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: read
    steps:
      - name: Check out trusted refresh request code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Select current refresh preparations
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
          TAVERNARY_PUBLISHER_BOT_ID: ${{ vars.TAVERNARY_PUBLISHER_BOT_ID }}
        run: node scripts/automation/preparation-request.mjs > "$RUNNER_TEMP/refresh-requests.json"
      - name: Create fresh preparation dispatch token
        if: steps.request.outputs.requests != '0'
        id: publisher-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.TAVERNARY_PUBLISHER_CLIENT_ID }}
          private-key: ${{ secrets.TAVERNARY_PUBLISHER_APP_PRIVATE_KEY }}
          permission-actions: write
      - name: Request immutable source preparation
        if: steps.request.outputs.requests != '0'
        env:
          GH_TOKEN: ${{ steps.publisher-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r operation_key source_id mode; do
            [[ "$operation_key" =~ ^[a-f0-9]{64}$ ]]
            [[ "$source_id" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]]
            [[ "$mode" == 'project' || "$mode" == 'forensic' ]]
            gh workflow run refresh-catalog.yml --repo "$GITHUB_REPOSITORY" --ref main \
              -f operation_key="$operation_key" -f source_id="$source_id" -f mode="$mode"
          done < <(jq -r '.[] | [.inputs.operation_key, .inputs.source_id, .inputs.mode] | @tsv' "$RUNNER_TEMP/refresh-requests.json")

  prepare:
    if: >-
      inputs.operation_key != '' &&
      github.ref == 'refs/heads/main' &&
      github.actor_id == vars.TAVERNARY_PUBLISHER_BOT_ID
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: read
    steps:
      - name: Check out pinned trusted preparation code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Prepare one current source operation
        id: prepare
        run: node scripts/automation/catalog-preparation-cli.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAVERNARY_PUBLISHER_BOT_ID: ${{ vars.TAVERNARY_PUBLISHER_BOT_ID }}
      - name: Retain immutable data result for the shared writer
        if: steps.prepare.outputs.result_available == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: automation-prepared-${{ inputs.operation_key }}
          path: ${{ runner.temp }}/automation-prepared/result.json
          if-no-files-found: error
          retention-days: 90
      - name: Retain safe preparation failure diagnostic
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: automation-failure-${{ inputs.operation_key }}-${{ github.run_id }}
          path: ${{ runner.temp }}/automation-prepared/diagnostic.json
          if-no-files-found: ignore
          retention-days: 90
