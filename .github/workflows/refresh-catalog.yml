name: Refresh catalog

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Select incremental observation, baseline queue, or one project.
        type: choice
        options:
          - incremental
          - baseline
          - project
          - forensic
        default: incremental
      batch_size:
        description: Number of provisional projects for baseline mode (1-24).
        type: number
        default: 12
      project_id:
        description: Required project ID for project or forensic mode.
        type: string
        required: false

permissions:
  contents: write
  actions: write

concurrency:
  group: catalog-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name == 'schedule' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Refresh selected sources
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: ${{ inputs.mode || 'incremental' }}
          BATCH_SIZE: ${{ inputs.batch_size || 12 }}
          PROJECT_ID: ${{ inputs.project_id || '' }}
        run: |
          args=(--mode "$MODE" --batch-size "$BATCH_SIZE" --deployment-requested)
          if [[ -n "$PROJECT_ID" ]]; then
            args+=(--project-id "$PROJECT_ID")
          fi
          npm run catalog:refresh -- "${args[@]}"
      - name: Validate refreshed catalog
        run: npm run check
      - name: Commit snapshot changes
        id: commit
        shell: bash
        run: |
          git add data/snapshots/github/*.json data/snapshots/github-refresh.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(catalog): refresh GitHub snapshots"
          for attempt in 1 2 3; do
            if git fetch origin main &&
              git rebase origin/main; then
              if npm run check &&
                git push origin HEAD:main; then
                break
              fi
            fi
            conflicts="$(git diff --name-only --diff-filter=U)"
            if [[ -n "$conflicts" ]]; then
              echo "Snapshot publication conflict:"
              echo "$conflicts"
            fi
            git rebase --abort || true
            if (( attempt == 3 )); then
              exit 1
            fi
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Redeploy refreshed catalog
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-pages.yml --ref main
      - name: Continue baseline queue
        if: ${{ success() && inputs.mode == 'baseline' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BATCH_SIZE: ${{ inputs.batch_size || 12 }}
        shell: bash
        run: |
          # counts.provisional is derived from current snapshot evidence_status values.
          remaining="$(
            node -e "const fs=require('fs');const value=JSON.parse(fs.readFileSync('data/snapshots/github-refresh.json','utf8')).counts.provisional;process.stdout.write(String(value))"
          )"
          if (( remaining > 0 )); then
            gh workflow run refresh-catalog.yml \
              --ref main \
              -f mode=baseline \
              -f batch_size="$BATCH_SIZE"
          else
            echo "Baseline queue complete."
          fi
