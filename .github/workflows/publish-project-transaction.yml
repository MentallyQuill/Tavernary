name: "Projects: Publish validated transaction"
run-name: "Project publication for validation #${{ inputs.validation_run_id }}"

on:
  workflow_dispatch:
    inputs:
      validation_run_id:
        description: Completed Site validation workflow run
        required: true
        type: number

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

concurrency:
  group: project-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: publisher
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      AUTO_PUBLICATION_ENABLED: ${{ vars.PROJECT_AUTO_PUBLICATION_ENABLED }}
      VALIDATION_RUN_ID: ${{ inputs.validation_run_id }}
    steps:
      - name: Resolve successful generated validation
        id: validation
        shell: bash
        run: |
          set -euo pipefail
          validation="${RUNNER_TEMP}/project-publication-validation.json"
          for attempt in $(seq 1 12); do
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${VALIDATION_RUN_ID}" \
              > "$validation"
            status="$(
              node -p "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8')).status" \
                "$validation"
            )"
            [[ "$status" == "completed" ]] && break
            sleep 5
          done
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const validation = JSON.parse(
            fs.readFileSync(
              `${process.env.RUNNER_TEMP}/project-publication-validation.json`,
              "utf8",
            ),
          );
          const generatedBranch =
            validation.head_branch?.startsWith("automation/project-submission-") ||
            validation.head_branch?.startsWith("automation/project-owner-request-");
          if (
            validation.path !== ".github/workflows/ci.yml" ||
            validation.event !== "workflow_dispatch" ||
            validation.status !== "completed" ||
            validation.conclusion !== "success" ||
            !generatedBranch ||
            !/^[0-9a-f]{40}$/u.test(validation.head_sha ?? "")
          ) {
            throw new Error(
              "Publication requires a successful generated-branch Site validation run.",
            );
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, [
            `head_sha=${validation.head_sha}`,
            `head_branch=${validation.head_branch}`,
            `conclusion=${validation.conclusion}`,
          ].join("\n") + "\n");
          NODE
      - name: Check out current default-branch publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Load exact pull request transaction state
        id: state
        shell: bash
        env:
          RUN_HEAD_SHA: ${{ steps.validation.outputs.head_sha }}
          RUN_HEAD_BRANCH: ${{ steps.validation.outputs.head_branch }}
        run: |
          set -euo pipefail
          pulls="${RUNNER_TEMP}/project-publication-pulls.json"
          pull="${RUNNER_TEMP}/project-publication-pull.json"
          files="${RUNNER_TEMP}/project-publication-files.json"
          issue="${RUNNER_TEMP}/project-publication-issue.json"
          repository="${RUNNER_TEMP}/project-publication-source-repository.json"
          gh api --method GET "repos/${GITHUB_REPOSITORY}/pulls" \
            -f state=open \
            -f head="${GITHUB_REPOSITORY_OWNER}:${RUN_HEAD_BRANCH}" \
            -f base="${{ github.event.repository.default_branch }}" \
            -f per_page=2 > "$pulls"
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import {
            parseProjectPublicationTransaction,
          } from "./scripts/publication/project-publication-transaction.mjs";
          const pulls = JSON.parse(
            fs.readFileSync(`${process.env.RUNNER_TEMP}/project-publication-pulls.json`, "utf8"),
          );
          if (pulls.length !== 1) {
            throw new Error("Expected exactly one open PR for the generated branch.");
          }
          const transaction = parseProjectPublicationTransaction(pulls[0].body ?? "");
          if (!transaction) {
            throw new Error(
              "Generated PR has no valid transaction. Schema version 2 is required; regenerate this request.",
            );
          }
          fs.writeFileSync(
            `${process.env.RUNNER_TEMP}/project-publication-pull.json`,
            JSON.stringify(pulls[0]),
          );
          fs.writeFileSync(
            `${process.env.RUNNER_TEMP}/project-publication-transaction.json`,
            JSON.stringify(transaction),
          );
          fs.appendFileSync(process.env.GITHUB_OUTPUT, [
            `pull_number=${pulls[0].number}`,
            `issue_number=${transaction.issue_number}`,
            `project_id=${transaction.project_ids[0] ?? ""}`,
            `project_ids=${transaction.project_ids.join(",")}`,
            `source_id=${transaction.source_id}`,
            `producer=${transaction.producer}`,
            `source_repository_id=${transaction.source_identity?.repository_id ?? ""}`,
          ].join("\n") + "\n");
          NODE
          pull_number="$(node -p "JSON.parse(require('fs').readFileSync('${RUNNER_TEMP}/project-publication-pull.json','utf8')).number")"
          issue_number="$(node -p "JSON.parse(require('fs').readFileSync('${RUNNER_TEMP}/project-publication-transaction.json','utf8')).issue_number")"
          source_repository_id="$(node -p "JSON.parse(require('fs').readFileSync('${RUNNER_TEMP}/project-publication-transaction.json','utf8')).source_identity?.repository_id ?? ''")"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${pull_number}" > "$pull"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${pull_number}/files?per_page=100" \
            --paginate --slurp > "$files"
          gh api "repos/${GITHUB_REPOSITORY}/issues/${issue_number}" \
            > "$issue"
          if [[ -n "$source_repository_id" ]]; then
            gh api "repositories/${source_repository_id}" > "$repository"
          else
            printf 'null' > "$repository"
          fi
      - name: Recheck mutable input and plan publication
        id: plan
        shell: bash
        env:
          CURRENT_MAIN_SHA: ${{ github.event.repository.default_branch == 'main' && github.sha || '' }}
          RUN_CONCLUSION: ${{ steps.validation.outputs.conclusion }}
          RUN_HEAD_SHA: ${{ steps.validation.outputs.head_sha }}
          RUN_HEAD_BRANCH: ${{ steps.validation.outputs.head_branch }}
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${{ github.event.repository.default_branch }}" --jq '.sha')"
          CURRENT_MAIN_SHA="$main_sha" node --input-type=module <<'NODE'
          import fs from "node:fs";
          import trustedEditors from "./data/maintenance/trusted-tavernary-editors.json" with { type: "json" };
          import frontends from "./data/vocabularies/frontends.json" with { type: "json" };
          import primaryFunctions from "./data/vocabularies/primary-functions.json" with { type: "json" };
          import tags from "./data/vocabularies/tags.json" with { type: "json" };
          import modelFamilies from "./data/vocabularies/model-families.json" with { type: "json" };
          import completionFormats from "./data/vocabularies/completion-formats.json" with { type: "json" };
          import { tagVocabularyHash } from "./scripts/catalog/tag-vocabulary.mjs";
          import { normalizeProjectOwnerManifest } from "./src/features/help/project-owner-manifest.mjs";
          import {
            fingerprintProjectRecord,
            fingerprintSourceRecord,
          } from "./src/features/help/project-owner-record.mjs";
          import { verifyTrustedEditor } from "./scripts/maintenance/trusted-editor-authority.mjs";
          import { parseProjectSubmissionIssue } from "./scripts/submissions/parse-project-submission.mjs";
          import { planProjectPublication } from "./scripts/publication/project-publication-planner.mjs";
          import { fingerprintProjectPublicationInput } from "./scripts/publication/project-publication-transaction.mjs";

          const read = (name) => JSON.parse(
            fs.readFileSync(`${process.env.RUNNER_TEMP}/${name}`, "utf8"),
          );
          const transaction = read("project-publication-transaction.json");
          const pull = read("project-publication-pull.json");
          const issue = read("project-publication-issue.json");
          const repository = read("project-publication-source-repository.json");
          const filePages = read("project-publication-files.json");
          const changedPaths = filePages.flat().map(({ filename }) => filename);
          const sourcePath =
            `data/registry/sources/${transaction.source_id}.json`;
          const source = fs.existsSync(sourcePath)
            ? JSON.parse(fs.readFileSync(sourcePath, "utf8"))
            : null;
          const actorMatches =
            issue.user?.id === transaction.actor.id &&
            issue.user?.type === transaction.actor.type &&
            issue.user?.login?.toLocaleLowerCase() ===
              transaction.actor.login.toLocaleLowerCase();
          const staff = verifyTrustedEditor({
            actor: issue.user,
            association: issue.author_association,
            registry: trustedEditors,
          });
          const ownerMatches =
            repository?.id === transaction.source_identity?.repository_id &&
            repository?.owner?.type === "User" &&
            repository.owner.id === transaction.actor.id;
          const authorityValid = actorMatches && (
            transaction.authority_type === "community-submitter" ||
            (transaction.authority_type === "tavernary-staff" && staff.authorized) ||
            (transaction.authority_type === "repository-owner" && ownerMatches)
          );
          let inputDigest = null;
          if (transaction.producer === "project-submission") {
            const parsed = parseProjectSubmissionIssue(issue.body ?? "");
            inputDigest = parsed.valid
              ? fingerprintProjectPublicationInput(parsed.manifest)
              : null;
          } else {
            const section = String(issue.body ?? "")
              .split(/^### /mu)
              .slice(1)
              .find((value) => value.split(/\r?\n/u)[0].trim() === "Owner request manifest");
            const rendered = section
              ? section.split(/\r?\n/u).slice(1).join("\n").trim()
              : "";
            const json = rendered.match(/^```(?:json)?\s*\r?\n([\s\S]*?)\r?\n```$/iu)?.[1] ?? rendered;
            try {
              const normalized = normalizeProjectOwnerManifest(
                JSON.parse(json),
                {
                  frontends: frontends.frontends,
                  primaryFunctions: primaryFunctions.primary_functions,
                  tags: tags.tags,
                  tagVocabularyHash: tagVocabularyHash(tags),
                  modelFamilies: modelFamilies.model_families,
                  completionFormats: completionFormats.completion_formats,
                  source,
                },
              );
              inputDigest = normalized.valid
                ? fingerprintProjectPublicationInput(normalized.manifest)
                : null;
            } catch {
              inputDigest = null;
            }
          }
          const projectFingerprints = Object.fromEntries(
            Object.keys(transaction.input_fingerprints.projects).map((projectId) => {
              const projectPath = `data/registry/projects/${projectId}.json`;
              const project = fs.existsSync(projectPath)
                ? JSON.parse(fs.readFileSync(projectPath, "utf8"))
                : null;
              return [
                projectId,
                project ? fingerprintProjectRecord(project) : null,
              ];
            }),
          );
          const sourceFingerprint =
            source === null ? null : fingerprintSourceRecord(source);
          const sourceIdentityValid =
            transaction.source_identity === null ||
            transaction.source_identity.repository_id === null ||
            repository?.id === transaction.source_identity.repository_id;
          const plan = planProjectPublication({
            enabled: process.env.AUTO_PUBLICATION_ENABLED === "true",
            workflowRun: {
              name: "Site: Validate changes",
              event: "workflow_dispatch",
              conclusion: process.env.RUN_CONCLUSION,
              head_sha: process.env.RUN_HEAD_SHA,
              head_branch: process.env.RUN_HEAD_BRANCH,
            },
            repository: process.env.GITHUB_REPOSITORY,
            defaultBranch: "${{ github.event.repository.default_branch }}",
            pull,
            transaction,
            issue,
            changedPaths,
            current: {
              mainSha: process.env.CURRENT_MAIN_SHA,
              inputDigest,
              projectFingerprints,
              sourceFingerprint,
              authorityValid,
              sourceIdentityValid,
            },
          });
          fs.writeFileSync(
            `${process.env.RUNNER_TEMP}/project-publication-plan.json`,
            JSON.stringify(plan),
          );
          fs.appendFileSync(process.env.GITHUB_OUTPUT, [
            `action=${plan.action}`,
            `reason=${plan.reasonCode ?? ""}`,
            `expected_head_sha=${plan.expectedHeadSha ?? ""}`,
          ].join("\n") + "\n");
          fs.appendFileSync(
            process.env.GITHUB_STEP_SUMMARY,
            `## Project publication\n\nAction: \`${plan.action}\`\n\nReason: \`${plan.reasonCode ?? "validated"}\`\n`,
          );
          NODE
      - name: Create Tavernary Publisher regeneration token
        id: publisher-regeneration-token
        if: steps.plan.outputs.action == 'regenerate'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.TAVERNARY_PUBLISHER_CLIENT_ID }}
          private-key: ${{ secrets.TAVERNARY_PUBLISHER_APP_PRIVATE_KEY }}
          permission-actions: write
      - name: Regenerate stale transaction
        if: steps.plan.outputs.action == 'regenerate'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.publisher-regeneration-token.outputs.token }}
          PRODUCER: ${{ steps.state.outputs.producer }}
          ISSUE_NUMBER: ${{ steps.state.outputs.issue_number }}
        run: |
          set -euo pipefail
          if [[ "$PRODUCER" == "project-submission" ]]; then
            gh workflow run generate-project-submission.yml --ref main \
              -f issue_number="$ISSUE_NUMBER" \
              -f force_regeneration=false
          else
            gh workflow run generate-project-owner-request.yml --ref main \
              -f issue_number="$ISSUE_NUMBER" \
              -f force_regeneration=false
          fi
      - name: Stop retryable publication
        if: steps.plan.outputs.action == 'retry'
        run: |
          echo "::error::Project publication is retryable: ${{ steps.plan.outputs.reason }}"
          exit 1
      - name: Await maintainer merge
        if: steps.plan.outputs.action == 'await-maintainer'
        run: |
          echo "This combined add-card request passed validation. A Tavernary maintainer must review and merge the single PR; this run will not merge or close the source issue." >> "$GITHUB_STEP_SUMMARY"
      - name: Create Tavernary Publisher merge token
        id: publisher-merge-token
        if: steps.plan.outputs.action == 'merge'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.TAVERNARY_PUBLISHER_CLIENT_ID }}
          private-key: ${{ secrets.TAVERNARY_PUBLISHER_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Merge exact validated head
        id: merge
        if: steps.plan.outputs.action == 'merge'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.publisher-merge-token.outputs.token }}
          PULL_NUMBER: ${{ steps.state.outputs.pull_number }}
          EXPECTED_HEAD_SHA: ${{ steps.plan.outputs.expected_head_sha }}
        run: |
          set -euo pipefail
          payload="${RUNNER_TEMP}/project-publication-merge.json"
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          fs.writeFileSync(
            `${process.env.RUNNER_TEMP}/project-publication-merge.json`,
            JSON.stringify({
              merge_method: "squash",
              sha: process.env.EXPECTED_HEAD_SHA,
              commit_title: `Publish project transaction PR #${process.env.PULL_NUMBER}`,
            }),
          );
          NODE
          result="$(gh api --method PUT \
            "repos/${GITHUB_REPOSITORY}/pulls/${PULL_NUMBER}/merge" \
            --input "$payload")"
          merged="$(node -e 'const v=JSON.parse(process.argv[1]); process.stdout.write(String(v.merged === true))' "$result")"
          merge_sha="$(node -e 'const v=JSON.parse(process.argv[1]); process.stdout.write(v.sha ?? "")' "$result")"
          if [[ "$merged" != "true" || ! "$merge_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Exact-SHA merge was not confirmed."
            exit 1
          fi
          echo "merge_sha=$merge_sha" >> "$GITHUB_OUTPUT"
      - name: Dispatch explicit post-merge lifecycle
        if: steps.merge.outputs.merge_sha != ''
        env:
          PRODUCER: ${{ steps.state.outputs.producer }}
          PULL_NUMBER: ${{ steps.state.outputs.pull_number }}
        run: |
          if [[ "$PRODUCER" == "project-submission" ]]; then
            gh workflow run project-submission-lifecycle.yml --ref main \
              -f pull_number="$PULL_NUMBER"
          else
            gh workflow run project-owner-request-lifecycle.yml --ref main \
              -f pull_number="$PULL_NUMBER"
          fi
      - name: Publish post-merge project notices
        id: notices
        if: steps.merge.outputs.merge_sha != ''
        continue-on-error: true
        shell: bash
        env:
          MERGE_SHA: ${{ steps.merge.outputs.merge_sha }}
          ISSUE_NUMBER: ${{ steps.state.outputs.issue_number }}
          PROJECT_ID: ${{ steps.state.outputs.project_id }}
          PULL_NUMBER: ${{ steps.state.outputs.pull_number }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git cat-file -e "${MERGE_SHA}^{commit}"
          git checkout --detach "$MERGE_SHA"
          comments="${RUNNER_TEMP}/project-publication-comments.json"
          notices="${RUNNER_TEMP}/project-publication-notices.json"
          existing="${RUNNER_TEMP}/project-owner-delist-issues.json"
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments?per_page=100" \
            > "$comments"
          gh label create owner-delist-notice \
            --color 6e7781 \
            --description "Maintenance notice for a completed verified-owner project delisting." \
            --force
          gh issue list --state open --label owner-delist-notice --limit 100 \
            --json number,title,body > "$existing"
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import {
            planCopyAdjustmentNotice,
            planOwnerDelistNotice,
          } from "./scripts/publication/project-publication-notices.mjs";
          const read = (name) => JSON.parse(
            fs.readFileSync(`${process.env.RUNNER_TEMP}/${name}`, "utf8"),
          );
          const transaction = read("project-publication-transaction.json");
          const pull = read("project-publication-pull.json");
          const issue = read("project-publication-issue.json");
          const comments = read("project-publication-comments.json").flat();
          const existingIssues = read("project-owner-delist-issues.json");
          const sourcePath =
            `data/registry/sources/${transaction.source_id}.json`;
          const source = fs.existsSync(sourcePath)
            ? JSON.parse(fs.readFileSync(sourcePath, "utf8"))
            : {};
          const projects = transaction.project_ids.map((projectId) => {
            const projectPath = `data/registry/projects/${projectId}.json`;
            return fs.existsSync(projectPath)
              ? JSON.parse(fs.readFileSync(projectPath, "utf8"))
              : { id: projectId, source_id: transaction.source_id };
          });
          const kits = fs.existsSync("data/registry/kits")
            ? fs.readdirSync("data/registry/kits")
                .filter((name) => name.endsWith(".json"))
                .map((name) => JSON.parse(
                  fs.readFileSync(`data/registry/kits/${name}`, "utf8"),
                ))
            : [];
          const section = String(issue.body ?? "")
            .split(/^### /mu)
            .slice(1)
            .find((value) => value.split(/\r?\n/u)[0].trim() === "Owner request manifest");
          const rendered = section
            ? section.split(/\r?\n/u).slice(1).join("\n").trim()
            : "";
          const json = rendered.match(/^```(?:json)?\s*\r?\n([\s\S]*?)\r?\n```$/iu)?.[1] ?? rendered;
          let ownerNote = null;
          try {
            ownerNote = JSON.parse(json).explanation ?? null;
          } catch {
            ownerNote = null;
          }
          const copy = planCopyAdjustmentNotice(transaction, comments);
          const delist = planOwnerDelistNotice({
            transaction,
            source,
            projects,
            kits,
            pull,
            issue: { ...issue, ownerNote },
            publishedAt: new Date().toISOString(),
            existingIssues,
          });
          fs.writeFileSync(
            `${process.env.RUNNER_TEMP}/project-publication-notices.json`,
            JSON.stringify({ copy, delist }),
          );
          NODE
          copy_action="$(node -p "JSON.parse(require('fs').readFileSync('${notices}','utf8')).copy.action")"
          if [[ "$copy_action" == "create" || "$copy_action" == "update" ]]; then
            copy_payload="${RUNNER_TEMP}/project-copy-notice-payload.json"
            node -e "const v=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')).copy; require('fs').writeFileSync(process.argv[2], JSON.stringify({body:v.body}))" "$notices" "$copy_payload"
            if [[ "$copy_action" == "create" ]]; then
              gh api --method POST \
                "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
                --input "$copy_payload"
            else
              comment_id="$(node -p "JSON.parse(require('fs').readFileSync('${notices}','utf8')).copy.commentId")"
              gh api --method PATCH \
                "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" \
                --input "$copy_payload"
            fi
          fi
          delist_action="$(node -p "JSON.parse(require('fs').readFileSync('${notices}','utf8')).delist.action")"
          if [[ "$delist_action" == "create" || "$delist_action" == "update" ]]; then
            delist_payload="${RUNNER_TEMP}/project-delist-notice-payload.json"
            node -e "const v=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')).delist; require('fs').writeFileSync(process.argv[2], JSON.stringify({title:v.title,body:v.body,labels:v.labels}))" "$notices" "$delist_payload"
            if [[ "$delist_action" == "create" ]]; then
              gh api --method POST "repos/${GITHUB_REPOSITORY}/issues" \
                --input "$delist_payload"
            else
              notice_number="$(node -p "JSON.parse(require('fs').readFileSync('${notices}','utf8')).delist.issueNumber")"
              gh api --method PATCH \
                "repos/${GITHUB_REPOSITORY}/issues/${notice_number}" \
                --input "$delist_payload"
            fi
          fi
      - name: Record retryable notification failure
        if: steps.notices.outcome == 'failure'
        run: |
          echo "Post-merge project notices failed and require an idempotent retry." >> "$GITHUB_STEP_SUMMARY"
      - name: Create Tavernary Publisher dispatch token
        id: publisher-dispatch-token
        if: steps.merge.outputs.merge_sha != ''
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.TAVERNARY_PUBLISHER_CLIENT_ID }}
          private-key: ${{ secrets.TAVERNARY_PUBLISHER_APP_PRIVATE_KEY }}
          permission-actions: write
      - name: Dispatch non-blocking Catalog Policy advisory
        if: steps.merge.outputs.merge_sha != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.publisher-dispatch-token.outputs.token }}
          PROJECT_ID: ${{ steps.state.outputs.project_id }}
          ISSUE_NUMBER: ${{ steps.state.outputs.issue_number }}
          PULL_NUMBER: ${{ steps.state.outputs.pull_number }}
          MERGE_SHA: ${{ steps.merge.outputs.merge_sha }}
        run: >
          gh workflow run review-catalog-policy.yml
          --ref main
          -f project_id="$PROJECT_ID"
          -f transaction_issue_number="$ISSUE_NUMBER"
          -f transaction_pull_number="$PULL_NUMBER"
          -f merge_sha="$MERGE_SHA"
      - name: Deploy exact merged project state
        if: steps.merge.outputs.merge_sha != ''
        env:
          MERGE_SHA: ${{ steps.merge.outputs.merge_sha }}
        run: >
          gh workflow run deploy-pages.yml
          --ref main
          -f source_sha="$MERGE_SHA"
