name: "Submission intake: Check issue eligibility"
run-name: "Issue #${{ github.event.issue.number }}: Check submission eligibility"

on:
  issues:
    types:
      - opened
      - reopened
      - edited

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: issue-admission-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  admit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Apply open-issue admission policy
        id: admission
        run: node scripts/submissions/admit-issue.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Reject conflicting submission labels
        if: >-
          steps.admission.outputs.admitted == 'true' &&
          steps.admission.outputs.route == 'conflict'
        run: |
          echo "::error::Issue has conflicting submission routing labels."
          exit 1
      - name: Dispatch project submission triage
        if: >-
          steps.admission.outputs.admitted == 'true' &&
          steps.admission.outputs.route == 'project'
        run: >
          gh workflow run triage-submission.yml
          --ref main
          -f issue_number="${{ steps.admission.outputs.issue_number }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Dispatch Kit submission triage
        if: >-
          steps.admission.outputs.admitted == 'true' &&
          steps.admission.outputs.route == 'kit'
        run: >
          gh workflow run triage-kit-submission.yml
          --ref main
          -f issue_number="${{ steps.admission.outputs.issue_number }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Dispatch Kit withdrawal
        if: >-
          steps.admission.outputs.admitted == 'true' &&
          steps.admission.outputs.route == 'kit-withdrawal'
        run: >
          gh workflow run apply-kit-withdrawal.yml
          --ref main
          -f issue_number="${{ steps.admission.outputs.issue_number }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
