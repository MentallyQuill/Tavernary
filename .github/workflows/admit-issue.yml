name: "Submission intake: Check issue eligibility"
run-name: "Issue #${{ inputs.issue_number || github.event.issue.number }}: Check submission eligibility"

on:
  issues:
    types:
      - opened
      - reopened
      - edited
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to re-run admission for"
        required: true
        type: number

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: issue-admission-${{ inputs.issue_number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  admit:
    runs-on: ubuntu-latest
    environment: publisher
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Apply open-issue admission policy
        id: admission
        run: node scripts/submissions/admit-issue.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ inputs.issue_number || github.event.issue.number }}
      - name: Reject conflicting submission labels
        if: >-
          steps.admission.outputs.admitted == 'true' &&
          steps.admission.outputs.route == 'conflict'
        run: |
          echo "::error::Issue has conflicting submission routing labels."
          exit 1
      - name: Dispatch project submission triage
        if: >-
          steps.admission.outputs.admitted == 'true' &&
          steps.admission.outputs.route == 'project'
        run: >
          gh workflow run triage-submission.yml
          --ref main
          -f issue_number="${{ steps.admission.outputs.issue_number }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Dispatch Kit submission triage
        if: >-
          steps.admission.outputs.admitted == 'true' &&
          steps.admission.outputs.route == 'kit'
        run: >
          gh workflow run triage-kit-submission.yml
          --ref main
          -f issue_number="${{ steps.admission.outputs.issue_number }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create Tavernary Publisher dispatch token
        id: publisher-dispatch-token
        if: >-
          steps.admission.outputs.admitted == 'true' &&
          steps.admission.outputs.route == 'kit-withdrawal'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.TAVERNARY_PUBLISHER_APP_ID }}
          private-key: ${{ secrets.TAVERNARY_PUBLISHER_APP_PRIVATE_KEY }}
          permission-actions: write
      - name: Dispatch Kit withdrawal
        if: >-
          steps.admission.outputs.admitted == 'true' &&
          steps.admission.outputs.route == 'kit-withdrawal'
        run: >
          gh workflow run apply-kit-withdrawal.yml
          --ref main
          -f issue_number="${{ steps.admission.outputs.issue_number }}"
        env:
          GH_TOKEN: ${{ steps.publisher-dispatch-token.outputs.token }}
      - name: Dispatch project owner request triage
        if: >-
          steps.admission.outputs.admitted == 'true' &&
          steps.admission.outputs.route == 'project-owner'
        run: >
          gh workflow run triage-project-owner-request.yml
          --ref "${{ github.event.repository.default_branch }}"
          -f issue_number="${{ steps.admission.outputs.issue_number }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Dispatch Help request triage
        if: >-
          steps.admission.outputs.admitted == 'true' &&
          (
            steps.admission.outputs.route == 'project-report' ||
            steps.admission.outputs.route == 'website-bug' ||
            steps.admission.outputs.route == 'kit-report' ||
            steps.admission.outputs.route == 'other-help'
          )
        run: >
          gh workflow run triage-help-request.yml
          --ref "${{ github.event.repository.default_branch }}"
          -f issue_number="${{ steps.admission.outputs.issue_number }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
