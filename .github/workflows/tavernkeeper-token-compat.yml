name: "Temporary: Prove opaque TavernKeeper wake token"

run-name: "Temporary: TavernKeeper wake token (${{ inputs.format }})"

on:
  workflow_dispatch:
    inputs:
      format:
        description: GitHub installation-token response format
        required: true
        type: choice
        options:
          - enabled
          - disabled

permissions: {}

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - name: Mint and consume the TavernKeeper wake token opaquely
        env:
          APP_ID: ${{ secrets.TAVERNKEEPER_WAKE_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.TAVERNKEEPER_WAKE_APP_PRIVATE_KEY }}
          FORMAT: ${{ inputs.format }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          [[ "$FORMAT" == "enabled" || "$FORMAT" == "disabled" ]]

          base64url() {
            openssl base64 -A | tr '+/' '-_' | tr -d '='
          }

          now="$(date +%s)"
          header="$(printf '%s' '{"alg":"RS256","typ":"JWT"}' | base64url)"
          payload="$(jq -nc --argjson iat "$((now - 60))" --argjson exp "$((now + 540))" --arg iss "$APP_ID" '{iat:$iat,exp:$exp,iss:$iss}' | base64url)"
          unsigned="$header.$payload"
          signature="$(printf '%s' "$unsigned" | openssl dgst -sha256 -sign <(printf '%s' "$APP_PRIVATE_KEY") -binary | base64url)"
          jwt="$unsigned.$signature"
          echo "::add-mask::$jwt"

          installation_id="$(curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $jwt" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/MentallyQuill/TavernKeeper/installation | jq -er '.id')"
          request="$(jq -nc '{repositories:["TavernKeeper"],permissions:{actions:"write",contents:"read"}}')"
          token="$(curl --fail --silent --show-error --request POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $jwt" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "X-GitHub-Stateless-S2S-Token: $FORMAT" \
            -d "$request" \
            "https://api.github.com/app/installations/$installation_id/access_tokens" | jq -er '.token')"
          echo "::add-mask::$token"

          jq -nc --arg format "$FORMAT" '{ref:"main",inputs:{format:$format}}' | \
            GH_TOKEN="$token" gh api --method POST \
              repos/MentallyQuill/TavernKeeper/actions/workflows/token-compat-receiver.yml/dispatches \
              --input -
          echo "format=$FORMAT actor_id=$GITHUB_ACTOR_ID"
