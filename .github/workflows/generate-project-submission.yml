name: "Project submissions: Create review PR"
run-name: "Project #${{ inputs.issue_number }}: Create review PR"

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Project submission issue number
        required: true
        type: number
      force_regeneration:
        description: Replace generated paths after acknowledged maintainer edits
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

concurrency:
  group: project-submission-${{ inputs.issue_number }}
  cancel-in-progress: true

jobs:
  generate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      ISSUE_NUMBER: ${{ inputs.issue_number }}
      FORCE_REGENERATION: ${{ inputs.force_regeneration }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAVERNARY_ENRICHMENT_API_URL: ${{ secrets.TAVERNARY_ENRICHMENT_API_URL }}
      TAVERNARY_ENRICHMENT_API_KEY: ${{ secrets.TAVERNARY_ENRICHMENT_API_KEY }}
      TAVERNARY_ENRICHMENT_MODEL: ${{ secrets.TAVERNARY_ENRICHMENT_MODEL }}
    steps:
      - name: Check out full main history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install repository dependencies
        run: npm ci
      - name: Inspect existing generated state
        id: state
        shell: bash
        run: |
          set -euo pipefail
          branch="automation/project-submission-${ISSUE_NUMBER}"
          issue_path="${RUNNER_TEMP}/project-submission-issue.json"
          pr_path="${RUNNER_TEMP}/project-submission-pr.json"
          gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}" > "$issue_path"
          node --input-type=module -e "
            import fs from 'node:fs';
            const issue = JSON.parse(fs.readFileSync(process.argv[1], 'utf8'));
            const labels = issue.labels.map((label) => label.name);
            if (issue.state !== 'open' || !labels.includes('issue-admitted') ||
                !labels.includes('project-submission') ||
                (!labels.includes('needs-maintainer-review') &&
                 !labels.includes('submission-pr-open') &&
                 !labels.includes('submission-retryable'))) {
              throw new Error('Submission issue is no longer admitted.');
            }
          " "$issue_path"
          gh pr list --state open --head "$branch" --limit 1 \
            --json number,body,headRefOid > "$pr_path"
          remote_sha="$(git ls-remote --heads origin "refs/heads/$branch" | awk '{print $1}')"
          node --input-type=module -e "
            import fs from 'node:fs';
            import { parseSubmissionPullRequestMarker } from './scripts/submissions/project-submission-pr.mjs';
            const pull = JSON.parse(fs.readFileSync(process.argv[1], 'utf8'))[0] ?? null;
            const marker = pull ? parseSubmissionPullRequestMarker(pull.body ?? '') : null;
            fs.writeFileSync(
              process.env.RUNNER_TEMP + '/previous-generated-paths.txt',
              (marker?.generated_paths ?? []).join('\n'),
            );
            fs.appendFileSync(process.env.GITHUB_OUTPUT, [
              'pr_number=' + (pull?.number ?? ''),
              'marker_sha=' + (marker?.generated_head_sha ?? ''),
            ].join('\n') + '\n');
          " "$pr_path"
          {
            echo "branch=$branch"
            echo "remote_sha=$remote_sha"
          } >> "$GITHUB_OUTPUT"
      - name: Protect maintainer corrections
        shell: bash
        env:
          PR_NUMBER: ${{ steps.state.outputs.pr_number }}
          MARKER_SHA: ${{ steps.state.outputs.marker_sha }}
          REMOTE_SHA: ${{ steps.state.outputs.remote_sha }}
        run: |
          set -euo pipefail
          if [[ -n "$PR_NUMBER" && ( -z "$MARKER_SHA" || "$REMOTE_SHA" != "$MARKER_SHA" ) && "$FORCE_REGENERATION" != "true" ]]; then
            echo "::error::Generated PR contains maintainer changes. Re-run with force_regeneration only after reviewing those edits."
            exit 1
          fi
      - name: Regenerate declared project files
        shell: bash
        env:
          BRANCH: ${{ steps.state.outputs.branch }}
          PR_NUMBER: ${{ steps.state.outputs.pr_number }}
          MARKER_SHA: ${{ steps.state.outputs.marker_sha }}
          REMOTE_SHA: ${{ steps.state.outputs.remote_sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$PR_NUMBER" && -n "$REMOTE_SHA" && -n "$MARKER_SHA" ]]; then
            git fetch origin "refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
            git rebase origin/main
            while IFS= read -r generated_path; do
              [[ -z "$generated_path" ]] && continue
              case "$generated_path" in
                data/registry/projects/*.json|data/registry/sources/*.json|data/snapshots/github/*.json|data/snapshots/codeberg/*.json|data/vocabularies/frontends.json) ;;
                *)
                  echo "::error::Refusing unsafe generated path: $generated_path"
                  exit 1
                  ;;
              esac
              if git cat-file -e "origin/main:$generated_path" 2>/dev/null; then
                git checkout origin/main -- "$generated_path"
              else
                git rm -f --ignore-unmatch -- "$generated_path"
              fi
            done < "${RUNNER_TEMP}/previous-generated-paths.txt"
          else
            git checkout -B "$BRANCH" origin/main
          fi
          node scripts/submissions/generate-project-submission.mjs \
            --issue-number "$ISSUE_NUMBER" \
            --output-directory "$GITHUB_WORKSPACE" \
            --report-path "${RUNNER_TEMP}/admission-report.json" \
            --retry-state-path "${RUNNER_TEMP}/project-submission-retry-state.json" \
            --failure-diagnostic-path "${RUNNER_TEMP}/project-submission-generation-failure.json"
      - name: Summarize copy review diagnostic
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { renderCopyReviewDiagnosticSummary } from "./scripts/catalog/catalog-copy-diagnostic.mjs";
          const report = JSON.parse(
            fs.readFileSync(`${process.env.RUNNER_TEMP}/admission-report.json`, "utf8"),
          );
          const values =
            report.copy_review_status === "unavailable"
              ? [report.copy_review_diagnostic]
              : [];
          const summary = renderCopyReviewDiagnosticSummary(values);
          if (summary) {
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${summary}\n`);
          }
          NODE
      - name: Validate proposed catalog and card
        run: |
          npm run catalog:validate
          npm run catalog:build
      - name: Synchronize classification review notice
        shell: bash
        run: |
          set -euo pipefail
          gh label create classification-review \
            --color d4c5f9 \
            --description "Optional intake review found a possible primary-function mismatch." \
            --force
          issue_path="${RUNNER_TEMP}/project-submission-issue.json"
          comments_path="${RUNNER_TEMP}/project-submission-comments.json"
          plan_path="${RUNNER_TEMP}/classification-review-notice-plan.json"
          gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}" > "$issue_path"
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments?per_page=100" \
            > "$comments_path"
          node --input-type=module -e "
            import fs from 'node:fs';
            import { planClassificationReviewNotice } from './scripts/submissions/classification-review-notice.mjs';
            const issue = JSON.parse(fs.readFileSync(process.argv[1], 'utf8'));
            const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
            const commentPages = JSON.parse(fs.readFileSync(process.argv[3], 'utf8'));
            const labels = issue.labels.map((label) => label.name);
            if (issue.state !== 'open' || !labels.includes('issue-admitted') ||
                !labels.includes('project-submission') ||
                (!labels.includes('needs-maintainer-review') &&
                 !labels.includes('submission-pr-open') &&
                 !labels.includes('submission-retryable'))) {
              throw new Error('Submission issue is no longer admitted.');
            }
            const plan = planClassificationReviewNotice({
              classificationReview: report.classificationReview ?? null,
              currentLabels: labels,
              comments: commentPages.flat(),
            });
            fs.writeFileSync(process.argv[4], JSON.stringify(plan));
            fs.writeFileSync(
              process.env.RUNNER_TEMP + '/classification-review-labels-to-delete.txt',
              plan.removeLabels.join('\n'),
            );
            fs.writeFileSync(
              process.env.RUNNER_TEMP + '/classification-review-labels.json',
              JSON.stringify({ labels: plan.addLabels }),
            );
            fs.writeFileSync(
              process.env.RUNNER_TEMP + '/classification-review-comment-ids-to-delete.txt',
              plan.removeCommentIds.join('\n'),
            );
            fs.writeFileSync(
              process.env.RUNNER_TEMP + '/classification-review-comment.json',
              JSON.stringify(plan.comment ? { body: plan.comment.body } : {}),
            );
          " "$issue_path" "${RUNNER_TEMP}/admission-report.json" "$comments_path" "$plan_path"
          while IFS= read -r label; do
            [[ -z "$label" ]] && continue
            if ! delete_output="$(gh api --method DELETE \
              "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/labels/${label}" 2>&1)"; then
              if [[ "$delete_output" != *"(HTTP 404)"* ]]; then
                echo "$delete_output" >&2
                exit 1
              fi
            fi
          done < "${RUNNER_TEMP}/classification-review-labels-to-delete.txt"
          if [[ "$(node -p "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8')).addLabels.length" "$plan_path")" -gt 0 ]]; then
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/labels" \
              --input "${RUNNER_TEMP}/classification-review-labels.json" \
              > /dev/null
          fi
          comment_action="$(node -p "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8')).comment?.action || ''" "$plan_path")"
          if [[ "$comment_action" == "create" ]]; then
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
              --input "${RUNNER_TEMP}/classification-review-comment.json" \
              > /dev/null
          elif [[ "$comment_action" == "update" ]]; then
            comment_id="$(node -p "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8')).comment.commentId" "$plan_path")"
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" \
              --input "${RUNNER_TEMP}/classification-review-comment.json" \
              > /dev/null
          fi
          while IFS= read -r comment_id; do
            [[ -z "$comment_id" ]] && continue
            if ! delete_output="$(gh api --method DELETE \
              "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" 2>&1)"; then
              if [[ "$delete_output" != *"(HTTP 404)"* ]]; then
                echo "$delete_output" >&2
                exit 1
              fi
            fi
          done < "${RUNNER_TEMP}/classification-review-comment-ids-to-delete.txt"
      - name: Prepare generated path set
        id: paths
        shell: bash
        run: |
          set -euo pipefail
          project_id="$(node -p "JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP + '/admission-report.json','utf8')).project_id")"
          source_id="$(node -p "JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP + '/admission-report.json','utf8')).source_id")"
          source_provider="$(node -p "JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP + '/admission-report.json','utf8')).source_provider || ''")"
          case "$source_provider" in
            github|codeberg|"") ;;
            *)
              echo "::error::Refusing unsafe generated provider: $source_provider"
              exit 1
              ;;
          esac
          generated_paths=(
            "data/registry/projects/${project_id}.json"
            "data/registry/sources/${source_id}.json"
          )
          if [[ -n "$source_provider" && -f "data/snapshots/${source_provider}/${source_id}.json" ]]; then
            generated_paths+=("data/snapshots/${source_provider}/${source_id}.json")
          fi
          if [[ -n "$(git status --porcelain -- data/vocabularies/frontends.json)" ]]; then
            generated_paths+=("data/vocabularies/frontends.json")
          fi
          while IFS= read -r previous_path; do
            [[ -z "$previous_path" ]] && continue
            case "$previous_path" in
              data/registry/projects/*.json|data/registry/sources/*.json|data/snapshots/github/*.json|data/snapshots/codeberg/*.json|data/vocabularies/frontends.json)
                generated_paths+=("$previous_path")
                ;;
              *)
                echo "::error::Refusing unsafe generated path: $previous_path"
                exit 1
                ;;
            esac
          done < "${RUNNER_TEMP}/previous-generated-paths.txt"
          mapfile -t generated_paths < <(printf '%s\n' "${generated_paths[@]}" | sort -u)
          printf '%s\n' "${generated_paths[@]}" > "${RUNNER_TEMP}/generated-paths.txt"
          echo "project_id=$project_id" >> "$GITHUB_OUTPUT"
      - name: Reject conflicting open submission paths
        shell: bash
        run: |
          set -euo pipefail
          pulls_path="${RUNNER_TEMP}/open-project-submission-pr-pages.json"
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" \
            > "$pulls_path"
          node --input-type=module -e "
            import fs from 'node:fs';
            import { findSubmissionPathCollision } from './scripts/submissions/project-submission-pr.mjs';
            const pages = JSON.parse(fs.readFileSync(process.argv[1], 'utf8'));
            const generatedPaths = fs.readFileSync(process.argv[2], 'utf8')
              .split(/\r?\n/u).filter(Boolean);
            const collision = findSubmissionPathCollision({
              repository: process.env.GITHUB_REPOSITORY,
              issueNumber: Number(process.env.ISSUE_NUMBER),
              generatedPaths,
              pulls: pages.flat(),
            });
            if (collision) {
              throw new Error(
                'Generated paths already belong to issue #' +
                collision.issueNumber + ' and PR #' + collision.prNumber +
                ': ' + collision.prUrl + ' (' + collision.paths.join(', ') + ')',
              );
            }
          " "$pulls_path" "${RUNNER_TEMP}/generated-paths.txt"
      - name: Commit generated paths
        id: commit
        shell: bash
        env:
          REMOTE_SHA: ${{ steps.state.outputs.remote_sha }}
          BRANCH: ${{ steps.state.outputs.branch }}
          PROJECT_ID: ${{ steps.paths.outputs.project_id }}
        run: |
          set -euo pipefail
          mapfile -t generated_paths < "${RUNNER_TEMP}/generated-paths.txt"
          git add -- "${generated_paths[@]}"
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "project_id=$PROJECT_ID" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "feat(catalog): propose project from issue #${ISSUE_NUMBER}"
          head_sha="$(git rev-parse HEAD)"
          if [[ -z "$REMOTE_SHA" ]]; then
            git push origin "HEAD:refs/heads/$BRANCH"
          else
            git push --force-with-lease="refs/heads/$BRANCH:$REMOTE_SHA" origin "HEAD:refs/heads/$BRANCH"
          fi
          {
            echo "changed=true"
            echo "head_sha=$head_sha"
            echo "project_id=$PROJECT_ID"
          } >> "$GITHUB_OUTPUT"
      - name: Create or update maintainer review PR
        if: steps.commit.outputs.changed == 'true' || steps.state.outputs.pr_number != ''
        shell: bash
        env:
          BRANCH: ${{ steps.state.outputs.branch }}
          HEAD_SHA: ${{ steps.commit.outputs.head_sha }}
          REMOTE_SHA: ${{ steps.state.outputs.remote_sha }}
          PR_NUMBER: ${{ steps.state.outputs.pr_number }}
          PROJECT_ID: ${{ steps.commit.outputs.project_id }}
        run: |
          set -euo pipefail
          node --input-type=module -e "
            import fs from 'node:fs';
            import { execFileSync } from 'node:child_process';
            import { CATALOG_POLICY_VERSION } from './src/features/catalog/catalog-policy.mjs';
            import { createProjectPublicationTransaction } from './scripts/publication/project-publication-transaction.mjs';
            import { renderSubmissionPullRequest } from './scripts/submissions/project-submission-pr.mjs';
            const report = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/admission-report.json', 'utf8'));
            const paths = fs.readFileSync(process.env.RUNNER_TEMP + '/generated-paths.txt', 'utf8').trim().split(/\r?\n/u).filter(Boolean);
            const authorityType = report.metadata_authority?.authorityType;
            const transaction = createProjectPublicationTransaction({
              schema_version: 2,
              operation: 'create',
              producer: 'project-submission',
              publication_mode: report.publication_mode,
              issue_number: Number(process.env.ISSUE_NUMBER),
              project_ids: [report.project_id],
              source_id: report.source_id,
              source_identity: report.source_identity,
              actor: report.actor,
              authority_type: authorityType,
              input_digest: report.input_digest,
              input_fingerprints: { projects: {}, source: null },
              base_sha: execFileSync('git', ['rev-parse', 'origin/main'], { encoding: 'utf8' }).trim(),
              generated_head_sha: process.env.HEAD_SHA || process.env.REMOTE_SHA,
              generated_paths: paths,
              policy_version: CATALOG_POLICY_VERSION,
              copy_result: report.copy_result
                ? { mode: report.copy_mode, ...report.copy_result }
                : null,
            });
            const body = renderSubmissionPullRequest({
              issueNumber: Number(process.env.ISSUE_NUMBER),
              projectName: report.inferred.name ?? report.project_id,
              report,
              marker: transaction,
            });
            fs.writeFileSync(process.env.RUNNER_TEMP + '/project-submission-pr.md', body);
          "
          title="[Project submission] ${PROJECT_ID}"
          # Refresh and revalidate issue before PR mutation.
          gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}" \
            > "${RUNNER_TEMP}/project-submission-issue.json"
          node --input-type=module -e "
            import fs from 'node:fs';
            const issue = JSON.parse(fs.readFileSync(process.argv[1], 'utf8'));
            const labels = issue.labels.map((label) => label.name);
            if (issue.state !== 'open' || !labels.includes('issue-admitted') ||
                !labels.includes('project-submission') ||
                (!labels.includes('needs-maintainer-review') &&
                 !labels.includes('submission-pr-open') &&
                 !labels.includes('submission-retryable'))) {
              throw new Error('Submission issue is no longer admitted.');
            }
          " "${RUNNER_TEMP}/project-submission-issue.json"
          if [[ -n "$PR_NUMBER" ]]; then
            gh pr edit "$PR_NUMBER" --title "$title" --body-file "${RUNNER_TEMP}/project-submission-pr.md"
          else
            gh pr create --base main --head "$BRANCH" --title "$title" --body-file "${RUNNER_TEMP}/project-submission-pr.md"
          fi
          # Refresh and revalidate issue before labeling.
          gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}" \
            > "${RUNNER_TEMP}/project-submission-issue.json"
          node --input-type=module -e "
            import fs from 'node:fs';
            const issue = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/project-submission-issue.json', 'utf8'));
            const labels = issue.labels.map((label) => label.name);
            if (issue.state !== 'open' || !labels.includes('issue-admitted') ||
                !labels.includes('project-submission') ||
                (!labels.includes('needs-maintainer-review') &&
                 !labels.includes('submission-pr-open') &&
                 !labels.includes('submission-retryable'))) {
              throw new Error('Submission issue is no longer admitted.');
            }
            const owned = new Set([
              'needs-maintainer-review',
              'needs-information',
              'duplicate-candidate',
              'submission-retryable',
              'submission-pr-open',
              'submission-declined',
            ]);
            fs.writeFileSync(
              process.env.RUNNER_TEMP + '/project-submission-labels-to-delete.txt',
              labels.filter((label) => owned.has(label) && label !== 'submission-pr-open').join('\n'),
            );
            fs.writeFileSync(
              process.env.RUNNER_TEMP + '/project-submission-labels.json',
              JSON.stringify({ labels: ['submission-pr-open'] }),
            );
          "
          while IFS= read -r label; do
            [[ -z "$label" ]] && continue
            if ! delete_output="$(gh api --method DELETE \
              "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/labels/${label}" 2>&1)"; then
              if [[ "$delete_output" != *"(HTTP 404)"* ]]; then
                echo "$delete_output" >&2
                exit 1
              fi
            fi
          done < "${RUNNER_TEMP}/project-submission-labels-to-delete.txt"
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/labels" \
            --input "${RUNNER_TEMP}/project-submission-labels.json"
      - name: Reconcile Reddit retry success
        if: steps.commit.outputs.changed == 'true' || steps.state.outputs.pr_number != ''
        env:
          ADMISSION_REPORT_PATH: ${{ runner.temp }}/admission-report.json
          GENERATION_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/submissions/project-submission-retry-state.mjs
      - name: Upload admission report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: project-submission-${{ inputs.issue_number }}-admission
          path: ${{ runner.temp }}/admission-report.json
          if-no-files-found: error
      - name: Dispatch CI for generated branch
        if: steps.commit.outputs.changed == 'true'
        env:
          BRANCH: ${{ steps.state.outputs.branch }}
        run: gh workflow run ci.yml --ref "$BRANCH"
      - name: Reconcile failed generation
        if: failure() && !cancelled()
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          GENERATION_PRODUCER: project-submission
          GENERATION_REASON_CODE: generation-failed
          GENERATION_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REDDIT_RETRY_STATE_PATH: ${{ runner.temp }}/project-submission-retry-state.json
          GENERATION_DIAGNOSTIC_PATH: ${{ runner.temp }}/project-submission-generation-failure.json
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/submissions/project-generation-failure.mjs
