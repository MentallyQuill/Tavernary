name: "Kit submissions: Validate submission"
run-name: "Kit #${{ inputs.issue_number }}: Validate submission"

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Kit submission issue number
        required: true
        type: number

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: triage-kit-${{ inputs.issue_number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    environment: publisher
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Validate and label Kit submission
        id: triage
        run: node scripts/submissions/triage-kit-issue.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
      - name: Create Tavernary Publisher dispatch token
        id: publisher-dispatch-token
        if: steps.triage.outputs.publish == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.TAVERNARY_PUBLISHER_APP_ID }}
          private-key: ${{ secrets.TAVERNARY_PUBLISHER_APP_PRIVATE_KEY }}
          permission-actions: write
      - name: Publish valid Kit
        if: steps.triage.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ steps.publisher-dispatch-token.outputs.token }}
          ISSUE_NUMBER: ${{ steps.triage.outputs.issue_number }}
        run: >
          gh workflow run apply-kit-submission.yml
          --ref main
          -f issue_number="$ISSUE_NUMBER"
