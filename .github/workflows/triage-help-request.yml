name: "Help requests: Triage report"
run-name: "Help request #${{ inputs.issue_number }}: Triage report"

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Public Help issue number
        required: true
        type: number

permissions:
  contents: read
  issues: write

concurrency:
  group: help-triage-${{ inputs.issue_number }}
  cancel-in-progress: true

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: Check out default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Validate and label Help request
        run: node scripts/help/triage-help-issue.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
