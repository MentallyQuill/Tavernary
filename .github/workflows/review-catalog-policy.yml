name: "Catalog: Advisory policy review"
run-name: >-
  ${{ inputs.operation_key
    && format('Automation prepare {0}', inputs.operation_key)
    || format('Catalog policy advisory for {0}', inputs.project_id || 'retry queue') }}

on:
  workflow_dispatch:
    inputs:
      operation_key:
        description: Immutable reconciled operation; empty for a published transaction.
        type: string
        required: false
        default: ""
      budget_ticket:
        description: Writer-reserved primary and repair allowance.
        type: string
        required: false
        default: ""
      project_id:
        description: Published project ID
        required: true
        type: string
      transaction_issue_number:
        description: Source transaction issue number
        required: true
        type: number
      transaction_pull_number:
        description: Merged transaction PR number
        required: true
        type: number
      merge_sha:
        description: Exact merged evidence state
        required: true
        type: string
  schedule:
    - cron: "43 5 * * *"

permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: write

concurrency:
  group: catalog-policy-review
  cancel-in-progress: false

jobs:
  review:
    if: >-
      inputs.operation_key == '' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' ||
       github.actor_id == 2625904 ||
       github.actor_id == vars.TAVERNARY_PUBLISHER_BOT_ID)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: publisher
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PROJECT_ID: ${{ inputs.project_id }}
      ISSUE_NUMBER: ${{ inputs.transaction_issue_number }}
      PULL_NUMBER: ${{ inputs.transaction_pull_number || 0 }}
      MERGE_SHA: ${{ inputs.merge_sha }}
    steps:
      - name: Check out trusted current request code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify exact published state
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$MERGE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "merge_sha must be an exact lowercase commit SHA." >&2
            exit 1
          fi

          if (( PULL_NUMBER > 0 )); then
            expected_merge_sha="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/$PULL_NUMBER" --jq '.merge_commit_sha // empty')"
            if [[ "$MERGE_SHA" != "$expected_merge_sha" ]]; then
              echo "merge_sha does not match pull request #$PULL_NUMBER." >&2
              exit 1
            fi
          fi

          relation="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${MERGE_SHA}...main" --jq '.status')"
          if [[ "$relation" != "ahead" && "$relation" != "identical" ]]; then
            echo "merge_sha is not an ancestor of current main." >&2
            exit 1
          fi
      - name: Select current eligible advisory requests
        id: request
        run: node scripts/automation/preparation-request.mjs > "$RUNNER_TEMP/advisory-requests.json"
        env:
          TAVERNARY_PUBLISHER_BOT_ID: ${{ vars.TAVERNARY_PUBLISHER_BOT_ID }}
      - name: Create fresh Publisher dispatch token
        id: publisher-token
        if: steps.request.outputs.requests != '0'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.TAVERNARY_PUBLISHER_CLIENT_ID }}
          private-key: ${{ secrets.TAVERNARY_PUBLISHER_APP_PRIVATE_KEY }}
          permission-actions: write
      - name: Request writer-reserved preparation or recovered notices
        if: steps.request.outputs.requests != '0'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.publisher-token.outputs.token }}
        run: |
          set -euo pipefail
          jq -r '.[] | [.inputs.mode, .inputs.operation_key] | @tsv' "$RUNNER_TEMP/advisory-requests.json" > "$RUNNER_TEMP/advisory-requests.tsv"
          while IFS=$'\t' read -r mode operation_key; do
            gh workflow run automation-writer.yml --repo "$GITHUB_REPOSITORY" --ref main \
              -f mode="$mode" -f operation_key="$operation_key"
          done < "$RUNNER_TEMP/advisory-requests.tsv"

  prepare:
    if: >-
      inputs.operation_key != '' &&
      github.ref == 'refs/heads/main' &&
      github.actor_id == vars.TAVERNARY_PUBLISHER_BOT_ID
    runs-on: ubuntu-latest
    environment: publisher
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: read
    steps:
      - name: Check out pinned trusted preparation code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Prepare one operation with reserved model allowance
        id: prepare
        run: node scripts/automation/catalog-preparation-cli.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAVERNARY_PUBLISHER_BOT_ID: ${{ vars.TAVERNARY_PUBLISHER_BOT_ID }}
          TAVERNARY_REQUIRE_MODEL_BUDGET: "true"
          UTILITY_API_ENDPOINT: ${{ secrets.UTILITY_API_ENDPOINT }}
          UTILITY_API_KEY: ${{ secrets.UTILITY_API_KEY }}
          UTILITY_MODEL: ${{ secrets.UTILITY_MODEL }}
          UTILITY_REASONING_EFFORT: ${{ vars.UTILITY_REASONING_EFFORT }}
          TAVERNARY_ENRICHMENT_API_URL: ${{ secrets.TAVERNARY_ENRICHMENT_API_URL }}
          TAVERNARY_ENRICHMENT_API_KEY: ${{ secrets.TAVERNARY_ENRICHMENT_API_KEY }}
          TAVERNARY_ENRICHMENT_MODEL: ${{ secrets.TAVERNARY_ENRICHMENT_MODEL }}
      - name: Retain immutable data result for the shared writer
        if: steps.prepare.outputs.result_available == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: automation-prepared-${{ inputs.operation_key }}
          path: ${{ runner.temp }}/automation-prepared/result.json
          if-no-files-found: error
          retention-days: 90
      - name: Retain safe preparation failure diagnostic
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: automation-failure-${{ inputs.operation_key }}-${{ github.run_id }}
          path: ${{ runner.temp }}/automation-prepared/diagnostic.json
          if-no-files-found: ignore
          retention-days: 90
