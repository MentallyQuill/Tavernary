name: "Kit submissions: Publish approved Kit"
run-name: "Kit #${{ inputs.issue_number }}: Publish approved Kit"

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Approved Kit submission issue number
        required: true
        type: number

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: kit-registry
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_dispatch' ||
      github.actor_id == 2625904 ||
      github.actor_id == vars.TAVERNARY_PUBLISHER_BOT_ID)
    runs-on: ubuntu-latest
    environment: publisher
    steps:
      - name: Create Tavernary Publisher token
        id: publisher-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.TAVERNARY_PUBLISHER_APP_ID }}
          private-key: ${{ secrets.TAVERNARY_PUBLISHER_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          token: ${{ steps.publisher-token.outputs.token }}
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Synchronize current main
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - name: Re-fetch, revalidate, and apply approved issue
        id: apply
        run: node scripts/kits/apply-submission.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
      - name: Initialize Kit community support
        run: node scripts/kits/refresh-reactions.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUIRED_KIT_ID: ${{ steps.apply.outputs.kit_id }}
      - name: Validate publication
        run: |
          npm run catalog:validate
          npm run catalog:build
          npm test
      - name: Commit canonical Kit
        id: commit
        shell: bash
        run: |
          git add data/registry/kits data/snapshots/github/kits
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "feat(kits): publish issue #${{ inputs.issue_number }}"
          fi
          for attempt in 1 2 3; do
            if git fetch origin main &&
              git rebase origin/main; then
              if npm run catalog:validate &&
                npm run catalog:build &&
                npm test &&
                git push origin HEAD:main; then
                break
              fi
            fi
            git rebase --abort || true
            if (( attempt == 3 )); then
              exit 1
            fi
          done
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Deploy updated catalog
        run: gh workflow run deploy-pages.yml --ref main -f source_sha="${{ steps.commit.outputs.sha }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Finalize published issue
        shell: bash
        run: |
          if ! gh label create kit-published \
            --color "1d76db" \
            --description "Kit publication has been applied to the catalog." \
            --force; then
            echo "::warning title=Kit publication bookkeeping::The Kit was published and deployment was requested, but the kit-published label could not be ensured."
          elif ! gh issue edit "${{ inputs.issue_number }}" --add-label kit-published; then
            echo "::warning title=Kit publication bookkeeping::The Kit was published and deployment was requested, but issue #${{ inputs.issue_number }} could not be labeled."
          fi
          if ! gh issue close "${{ inputs.issue_number }}" --reason completed; then
            echo "::warning title=Kit publication bookkeeping::The Kit was published and deployment was requested, but issue #${{ inputs.issue_number }} could not be closed."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
