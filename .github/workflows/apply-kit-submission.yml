name: "Kit submissions: Publish approved Kit"
run-name: >-
  ${{ inputs.operation_key
    && format('Automation prepare {0}', inputs.operation_key)
    || format('Kit #{0}: Publish approved Kit', inputs.issue_number) }}

on:
  workflow_dispatch:
    inputs:
      operation_key:
        description: Immutable operation selected by the reconciler; empty for the existing review entrypoint.
        required: false
        type: string
        default: ""
      issue_number:
        description: Approved Kit submission issue number
        required: true
        type: number

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: kit-registry
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      inputs.operation_key == '' &&
      github.ref == 'refs/heads/main' &&
      (github.actor_id == 2625904 ||
      github.actor_id == vars.TAVERNARY_PUBLISHER_BOT_ID)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: publisher
    permissions:
      contents: read
      actions: read
      issues: write
      pull-requests: read
    steps:
      - name: Check out trusted request code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Revalidate the current issue and correction state
        id: request
        run: node scripts/automation/preparation-request.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAVERNARY_PUBLISHER_BOT_ID: ${{ vars.TAVERNARY_PUBLISHER_BOT_ID }}
      - name: Create fresh Publisher token
        id: publisher-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.TAVERNARY_PUBLISHER_CLIENT_ID }}
          private-key: ${{ secrets.TAVERNARY_PUBLISHER_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: read
          permission-actions: write
      - name: Publish current validated Kit with an exact-parent write
        id: commit
        env:
          GH_TOKEN: ${{ steps.publisher-token.outputs.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          TAVERNARY_PUBLISHER_BOT_ID: ${{ vars.TAVERNARY_PUBLISHER_BOT_ID }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFile } from "node:fs/promises";
          import { runDirectKitPublication } from "./scripts/kits/apply-submission.mjs";
          const result = await runDirectKitPublication();
          console.log(JSON.stringify(result));
          await appendFile(process.env.GITHUB_OUTPUT, `published=${result.status === "published"}\nsha=${result.sha ?? ""}\n`);
          NODE
      - name: Deploy the published Kit revision
        if: steps.commit.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ steps.publisher-token.outputs.token }}
          SOURCE_SHA: ${{ steps.commit.outputs.sha }}
        run: gh workflow run deploy-pages.yml --repo "$GITHUB_REPOSITORY" --ref main -f source_sha="$SOURCE_SHA"

  prepare:
    if: >-
      inputs.operation_key != '' &&
      github.ref == 'refs/heads/main' &&
      github.actor_id == vars.TAVERNARY_PUBLISHER_BOT_ID
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: read
    steps:
      - name: Check out pinned trusted preparation code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Prepare current Kit data without publication or closure
        id: prepare
        run: node scripts/automation/catalog-preparation-cli.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAVERNARY_PUBLISHER_BOT_ID: ${{ vars.TAVERNARY_PUBLISHER_BOT_ID }}
      - name: Retain immutable data result for the shared writer
        if: steps.prepare.outputs.result_available == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: automation-prepared-${{ inputs.operation_key }}
          path: ${{ runner.temp }}/automation-prepared/result.json
          if-no-files-found: error
          retention-days: 90
      - name: Retain safe preparation failure diagnostic
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: automation-failure-${{ inputs.operation_key }}-${{ github.run_id }}
          path: ${{ runner.temp }}/automation-prepared/diagnostic.json
          if-no-files-found: ignore
          retention-days: 90
