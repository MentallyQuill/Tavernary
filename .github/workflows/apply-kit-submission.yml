name: "Kit submissions: Publish approved Kit"
run-name: >-
  ${{ inputs.operation_key
    && format('Automation prepare {0}', inputs.operation_key)
    || format('Kit #{0}: Publish approved Kit', inputs.issue_number) }}

on:
  workflow_dispatch:
    inputs:
      operation_key:
        description: Immutable operation selected by the reconciler; empty for the existing review entrypoint.
        required: false
        type: string
        default: ""
      issue_number:
        description: Approved Kit submission issue number
        required: true
        type: number

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: kit-registry
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      inputs.operation_key == '' &&
      github.ref == 'refs/heads/main' &&
      (github.actor_id == 2625904 ||
      github.actor_id == vars.TAVERNARY_PUBLISHER_BOT_ID)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: publisher
    permissions:
      contents: read
      actions: read
      issues: write
      pull-requests: read
    steps:
      - name: Check out trusted request code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Revalidate the current issue and correction state
        id: request
        run: node scripts/automation/preparation-request.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAVERNARY_PUBLISHER_BOT_ID: ${{ vars.TAVERNARY_PUBLISHER_BOT_ID }}
      - name: Create fresh Publisher dispatch token
        id: publisher-token
        if: steps.request.outputs.prepare == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.TAVERNARY_PUBLISHER_CLIENT_ID }}
          private-key: ${{ secrets.TAVERNARY_PUBLISHER_APP_PRIVATE_KEY }}
          permission-actions: write
      - name: Dispatch immutable read-only preparation
        if: steps.request.outputs.prepare == 'true'
        run: >-
          gh workflow run apply-kit-submission.yml --repo "$GITHUB_REPOSITORY" --ref main
          -f issue_number="$ISSUE_NUMBER" -f operation_key="$OPERATION_KEY"
        env:
          GH_TOKEN: ${{ steps.publisher-token.outputs.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          OPERATION_KEY: ${{ steps.request.outputs.operation_key }}

  prepare:
    if: >-
      inputs.operation_key != '' &&
      github.ref == 'refs/heads/main' &&
      github.actor_id == vars.TAVERNARY_PUBLISHER_BOT_ID
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: read
    steps:
      - name: Check out pinned trusted preparation code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Prepare current Kit data without publication or closure
        id: prepare
        run: node scripts/automation/catalog-preparation-cli.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAVERNARY_PUBLISHER_BOT_ID: ${{ vars.TAVERNARY_PUBLISHER_BOT_ID }}
      - name: Retain immutable data result for the shared writer
        if: steps.prepare.outputs.result_available == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: automation-prepared-${{ inputs.operation_key }}
          path: ${{ runner.temp }}/automation-prepared/result.json
          if-no-files-found: error
          retention-days: 90
      - name: Retain safe preparation failure diagnostic
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: automation-failure-${{ inputs.operation_key }}-${{ github.run_id }}
          path: ${{ runner.temp }}/automation-prepared/diagnostic.json
          if-no-files-found: ignore
          retention-days: 90
