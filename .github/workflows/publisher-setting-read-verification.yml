name: "Publisher: Verify publication setting read permission"

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: publisher-setting-read-verification
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.ref == 'refs/heads/main' && github.actor_id == 2625904
    runs-on: ubuntu-latest
    environment: publisher
    timeout-minutes: 5
    steps:
      - name: Create scoped publication settings read token
        id: reader-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.TAVERNARY_PUBLISHER_CLIENT_ID }}
          private-key: ${{ secrets.TAVERNARY_PUBLISHER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-actions-variables: read
      - name: Read current publication switch
        env:
          GH_TOKEN: ${{ steps.reader-token.outputs.token }}
        run: >-
          gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/variables/PROJECT_AUTO_PUBLICATION_ENABLED"
          --jq '.value == "true"'
