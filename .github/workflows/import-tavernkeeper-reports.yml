name: "Security: Reconcile TavernKeeper reports"

run-name: >-
  ${{ github.event_name == 'schedule'
    && 'Security: Reconcile scheduled TavernKeeper reports'
    || 'Security: Reconcile TavernKeeper reports' }}

on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:
    inputs:
      retry_report_digest:
        description: "Optional exact quarantined report digest to retry"
        required: false
        type: string

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: tavernkeeper-report-import
  cancel-in-progress: false

jobs:
  import:
    if: github.event_name == 'schedule' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      sha: ${{ steps.commit.outputs.sha }}
      imported: ${{ steps.import.outputs.imported }}
      quarantined: ${{ steps.import.outputs.quarantined }}
      remaining: ${{ steps.import.outputs.remaining }}
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Import and synthesize validated TavernKeeper reports
        id: import
        env:
          TAVERNARY_ENRICHMENT_API_URL: ${{ secrets.TAVERNARY_ENRICHMENT_API_URL }}
          TAVERNARY_ENRICHMENT_API_KEY: ${{ secrets.TAVERNARY_ENRICHMENT_API_KEY }}
          TAVERNARY_ENRICHMENT_MODEL: ${{ secrets.TAVERNARY_ENRICHMENT_MODEL }}
          TAVERNARY_RETRY_REPORT_DIGEST: ${{ inputs.retry_report_digest || '' }}
        shell: bash
        run: |
          if [[ -n "$TAVERNARY_RETRY_REPORT_DIGEST" && ! "$TAVERNARY_RETRY_REPORT_DIGEST" =~ ^[0-9a-f]{64}$ ]]; then
            echo "retry_report_digest must be one lowercase 64-character hexadecimal digest." >&2
            exit 1
          fi
          result="$(npm run --silent security:import-reports)"
          printf '%s\n' "$result"
          imported="$(jq -er '.imported | select(type == "number")' <<< "$result")"
          retained="$(jq -er '.retained | select(type == "number")' <<< "$result")"
          quarantined="$(jq -er '.quarantined | select(type == "number")' <<< "$result")"
          skipped_quarantines="$(jq -er '.skipped_quarantines | select(type == "number")' <<< "$result")"
          remaining="$(jq -er '.remaining | select(type == "number")' <<< "$result")"
          created_or_updated="$(jq -cer '.created_or_updated | select(type == "array")' <<< "$result")"
          resolved="$(jq -cer '.resolved | select(type == "array")' <<< "$result")"
          printf 'imported=%s\n' "$imported" >> "$GITHUB_OUTPUT"
          printf 'retained=%s\n' "$retained" >> "$GITHUB_OUTPUT"
          printf 'quarantined=%s\n' "$quarantined" >> "$GITHUB_OUTPUT"
          printf 'skipped_quarantines=%s\n' "$skipped_quarantines" >> "$GITHUB_OUTPUT"
          printf 'remaining=%s\n' "$remaining" >> "$GITHUB_OUTPUT"
          printf 'created_or_updated=%s\n' "$created_or_updated" >> "$GITHUB_OUTPUT"
          printf 'resolved=%s\n' "$resolved" >> "$GITHUB_OUTPUT"
          printf '## TavernKeeper report import\n\n- Imported: %s\n- Retained: %s\n- Quarantined: %s\n- Skipped quarantines: %s\n- Remaining: %s\n' \
            "$imported" "$retained" "$quarantined" "$skipped_quarantines" "$remaining" >> "$GITHUB_STEP_SUMMARY"
      - name: Validate imported summaries
        run: npm run check
      - name: Commit and publish changed summaries
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git add -- data/security/tavernkeeper-report-summaries.json data/security/tavernkeeper-import-state.json
          if git diff --cached --quiet -- data/security/tavernkeeper-report-summaries.json data/security/tavernkeeper-import-state.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            git fetch --no-tags origin main
            git merge --ff-only origin/main
            npm run check
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(security): import TavernKeeper reports"

          for attempt in 1 2 3; do
            if git fetch --no-tags origin main &&
              git rebase origin/main &&
              npm run check &&
              git fetch --no-tags origin main &&
              git rebase origin/main &&
              npm run catalog:validate &&
              npm run security:validate-reports &&
              git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            git rebase --abort || true
            if (( attempt == 3 )); then
              echo "Failed to publish TavernKeeper report summaries after three attempts." >&2
              exit 1
            fi
          done
      - name: Reconcile report synthesis incidents
        env:
          GH_TOKEN: ${{ github.token }}
          CREATED_OR_UPDATED: ${{ steps.import.outputs.created_or_updated }}
          RESOLVED: ${{ steps.import.outputs.resolved }}
        shell: bash
        run: |
          gh label create tavernkeeper-import --color B60205 --description "TavernKeeper report import quarantine" --force

          jq -c '.[]' <<< "$CREATED_OR_UPDATED" | while read -r incident; do
            incident_key="$(jq -r '.incident_key' <<< "$incident")"
            repository="$(jq -r '.repository' <<< "$incident")"
            repository_id="$(jq -r '.repository_id' <<< "$incident")"
            target_sha="$(jq -r '.target_sha' <<< "$incident")"
            report_digest="$(jq -r '.report_digest' <<< "$incident")"
            policy="$(jq -r '.synthesis_policy_version' <<< "$incident")"
            diagnostic="$(jq -r '.diagnostic' <<< "$incident")"
            attempts="$(jq -r '.attempts' <<< "$incident")"
            issues="$(gh issue list --state all --label tavernkeeper-import --limit 100 --json number,state,body)"
            existing="$(jq -r --arg key "$incident_key" '
              map(select(.body | contains("Report incident key: `" + $key + "`")))
              | .[0] // empty
            ' <<< "$issues")"
            if [[ -z "$existing" ]]; then
              gh issue create \
                --label tavernkeeper-import \
                --title "[tavernkeeper-import] report synthesis quarantined" \
                --body "Tavernary rejected bounded structured synthesis output for one immutable report.\n\nReport incident key: \`$incident_key\`\nRepository: \`$repository\`\nRepository ID: \`$repository_id\`\nTarget commit: \`$target_sha\`\nReport digest: \`$report_digest\`\nSynthesis policy: \`$policy\`\nDiagnostic: \`$diagnostic\`\nAttempts: \`$attempts\`\nRun: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\n\nOther valid reports continue importing."
            else
              number="$(jq -r '.number' <<< "$existing")"
              state="$(jq -r '.state' <<< "$existing")"
              if [[ "$state" == "CLOSED" ]]; then
                gh issue reopen "$number" --comment "The exact report-policy quarantine recurred on run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID."
              else
                gh issue comment "$number" --body "The explicit retry remained invalid at attempt $attempts on run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID."
              fi
            fi
          done

          jq -c '.[]' <<< "$RESOLVED" | while read -r incident; do
            incident_key="$(jq -r '.incident_key' <<< "$incident")"
            issues="$(gh issue list --state open --label tavernkeeper-import --limit 100 --json number,body)"
            number="$(jq -r --arg key "$incident_key" '
              map(select(.body | contains("Report incident key: `" + $key + "`")))
              | .[0].number // empty
            ' <<< "$issues")"
            if [[ -n "$number" ]]; then
              gh issue close "$number" --comment "This exact report-policy quarantine is no longer active."
            fi
          done

  deploy:
    needs: import
    if: ${{ always() && needs.import.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Deploy the exact reconciled summary commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ needs.import.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run deploy-pages.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f source_sha="$SOURCE_SHA"

  continue:
    needs: import
    if: ${{ always() && needs.import.result == 'success' && needs.import.outputs.remaining != '0' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Continue due report imports independently of deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run import-tavernkeeper-reports.yml --repo "$GITHUB_REPOSITORY" --ref main
