name: "Security: Reconcile TavernKeeper reports"

run-name: >-
  ${{ inputs.operation_key
    && format('Automation prepare {0}', inputs.operation_key)
    || inputs.retry_report_digest
    && format('Security: Retry narrative {0}', inputs.retry_report_digest)
    || github.event_name == 'schedule'
    && 'Security: Reconcile scheduled TavernKeeper reports'
    || 'Security: Reconcile TavernKeeper reports' }}

on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:
    inputs:
      operation_key:
        description: Immutable operation selected by the reconciler; empty for an owner request.
        required: false
        type: string
        default: ""
      budget_ticket:
        description: Verified writer-owned model allowance; empty for deterministic import.
        required: false
        type: string
        default: ""
      retry_report_digest:
        description: Optional exact quarantined report digest for an owner narrative retry.
        required: false
        type: string

permissions:
  contents: read
  actions: read
  issues: read

concurrency:
  group: tavernkeeper-report-import-${{ inputs.operation_key || 'request' }}
  cancel-in-progress: false

jobs:
  import:
    if: >-
      inputs.operation_key == '' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_dispatch' ||
      github.actor_id == 2625904 ||
      github.actor_id == vars.TAVERNARY_PUBLISHER_BOT_ID ||
      github.actor_id == 311860138)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: publisher
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: read
    steps:
      - name: Check out trusted report request code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Select current immutable report preparations
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
          TAVERNARY_PUBLISHER_BOT_ID: ${{ vars.TAVERNARY_PUBLISHER_BOT_ID }}
        run: node scripts/automation/preparation-request.mjs > "$RUNNER_TEMP/report-requests.json"
      - name: Create fresh report dispatch token
        if: steps.request.outputs.requests != '0'
        id: publisher-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.TAVERNARY_PUBLISHER_CLIENT_ID }}
          private-key: ${{ secrets.TAVERNARY_PUBLISHER_APP_PRIVATE_KEY }}
          permission-actions: write
      - name: Request bounded report preparation
        if: steps.request.outputs.requests != '0'
        env:
          GH_TOKEN: ${{ steps.publisher-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r workflow operation_key mode; do
            [[ "$operation_key" =~ ^[a-f0-9]{64}$ ]]
            if [[ "$workflow" == 'automation-writer.yml' && "$mode" == 'prepare' ]]; then
              gh workflow run automation-writer.yml --repo "$GITHUB_REPOSITORY" --ref main \
                -f operation_key="$operation_key" -f mode=prepare
            elif [[ "$workflow" == 'import-tavernkeeper-reports.yml' && "$mode" == '-' ]]; then
              gh workflow run import-tavernkeeper-reports.yml --repo "$GITHUB_REPOSITORY" --ref main \
                -f operation_key="$operation_key"
            else
              exit 1
            fi
          done < <(jq -r '.[] | [.workflow, .inputs.operation_key, (.inputs.mode // "-")] | @tsv' "$RUNNER_TEMP/report-requests.json")

  prepare:
    if: >-
      inputs.operation_key != '' &&
      github.ref == 'refs/heads/main' &&
      github.actor_id == vars.TAVERNARY_PUBLISHER_BOT_ID
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: read
    steps:
      - name: Check out pinned trusted preparation code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Prepare one immutable report operation
        id: prepare
        run: node scripts/automation/catalog-preparation-cli.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAVERNARY_PUBLISHER_BOT_ID: ${{ vars.TAVERNARY_PUBLISHER_BOT_ID }}
          TAVERNARY_REQUIRE_MODEL_BUDGET: "true"
          UTILITY_API_ENDPOINT: ${{ inputs.budget_ticket != '' && secrets.UTILITY_API_ENDPOINT || '' }}
          UTILITY_API_KEY: ${{ inputs.budget_ticket != '' && secrets.UTILITY_API_KEY || '' }}
          UTILITY_MODEL: ${{ inputs.budget_ticket != '' && secrets.UTILITY_MODEL || '' }}
          UTILITY_REASONING_EFFORT: ${{ vars.UTILITY_REASONING_EFFORT }}
          TAVERNARY_ENRICHMENT_API_URL: ${{ inputs.budget_ticket != '' && secrets.TAVERNARY_ENRICHMENT_API_URL || '' }}
          TAVERNARY_ENRICHMENT_API_KEY: ${{ inputs.budget_ticket != '' && secrets.TAVERNARY_ENRICHMENT_API_KEY || '' }}
          TAVERNARY_ENRICHMENT_MODEL: ${{ inputs.budget_ticket != '' && secrets.TAVERNARY_ENRICHMENT_MODEL || '' }}
      - name: Retain immutable data result for the shared writer
        if: steps.prepare.outputs.result_available == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: automation-prepared-${{ inputs.operation_key }}
          path: ${{ runner.temp }}/automation-prepared/result.json
          if-no-files-found: error
          retention-days: 90
      - name: Retain safe preparation failure diagnostic
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: automation-failure-${{ inputs.operation_key }}-${{ github.run_id }}
          path: ${{ runner.temp }}/automation-prepared/diagnostic.json
          if-no-files-found: ignore
          retention-days: 90
