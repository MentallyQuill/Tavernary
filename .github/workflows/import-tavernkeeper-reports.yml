name: "Security: Reconcile TavernKeeper reports"

run-name: >-
  ${{ github.event_name == 'schedule'
    && 'Security: Reconcile scheduled TavernKeeper reports'
    || 'Security: Reconcile TavernKeeper reports' }}

on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: tavernkeeper-report-import
  cancel-in-progress: false

jobs:
  import:
    if: github.event_name == 'schedule' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      sha: ${{ steps.commit.outputs.sha }}
      imported: ${{ steps.import.outputs.imported }}
      failed: ${{ steps.import.outputs.failed }}
      pending_due: ${{ steps.import.outputs.pending_due }}
      pending_delayed: ${{ steps.import.outputs.pending_delayed }}
      next_wake_at: ${{ steps.import.outputs.next_wake_at }}
      chronic_failures: ${{ steps.import.outputs.chronic_failures }}
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Import and synthesize validated TavernKeeper reports
        id: import
        env:
          TAVERNARY_ENRICHMENT_API_URL: ${{ secrets.TAVERNARY_ENRICHMENT_API_URL }}
          TAVERNARY_ENRICHMENT_API_KEY: ${{ secrets.TAVERNARY_ENRICHMENT_API_KEY }}
          TAVERNARY_ENRICHMENT_MODEL: ${{ secrets.TAVERNARY_ENRICHMENT_MODEL }}
        shell: bash
        run: |
          result="$(npm run --silent security:import-reports)"
          printf '%s\n' "$result"
          echo "imported=$(jq -er '.imported | select(type == \"number\")' <<< "$result")" >> "$GITHUB_OUTPUT"
          echo "failed=$(jq -er '.failed | select(type == \"number\")' <<< "$result")" >> "$GITHUB_OUTPUT"
          echo "pending_due=$(jq -er '.pending_due | select(type == \"number\")' <<< "$result")" >> "$GITHUB_OUTPUT"
          echo "pending_delayed=$(jq -er '.pending_delayed | select(type == \"number\")' <<< "$result")" >> "$GITHUB_OUTPUT"
          echo "next_wake_at=$(jq -r '.next_wake_at // \"\"' <<< "$result")" >> "$GITHUB_OUTPUT"
          echo "chronic_failures=$(jq -er '.chronic_failures | select(type == \"number\")' <<< "$result")" >> "$GITHUB_OUTPUT"
      - name: Validate imported summaries
        run: npm run check
      - name: Commit and publish changed summaries
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git add -- data/security/tavernkeeper-report-summaries.json data/security/tavernkeeper-import-state.json
          if git diff --cached --quiet -- data/security/tavernkeeper-report-summaries.json data/security/tavernkeeper-import-state.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            git fetch --no-tags origin main
            git merge --ff-only origin/main
            npm run check
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(security): import TavernKeeper reports"

          for attempt in 1 2 3; do
            if git fetch --no-tags origin main &&
              git rebase origin/main &&
              npm run check &&
              git fetch --no-tags origin main &&
              git rebase origin/main &&
              npm run catalog:validate &&
              npm run security:validate-reports &&
              git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            git rebase --abort || true
            if (( attempt == 3 )); then
              echo "Failed to publish TavernKeeper report summaries after three attempts." >&2
              exit 1
            fi
          done

  deploy:
    needs: import
    if: ${{ always() && needs.import.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Deploy the exact reconciled summary commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ needs.import.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run deploy-pages.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f source_sha="$SOURCE_SHA"

  continue:
    needs: import
    if: ${{ always() && needs.import.result == 'success' && needs.import.outputs.pending_due != '0' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Continue due report imports independently of deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run import-tavernkeeper-reports.yml --repo "$GITHUB_REPOSITORY" --ref main
