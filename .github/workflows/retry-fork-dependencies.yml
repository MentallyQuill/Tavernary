name: "Project submissions: Retry fork dependencies"
run-name: "Project submissions: Retry terminal fork dependencies"

on:
  push:
    branches:
      - main
    paths:
      - "data/registry/projects/**"
  workflow_dispatch:
    inputs:
      upstream_issue_number:
        description: Closed upstream project submission issue number
        required: false
        type: number

permissions:
  contents: read
  issues: read
  actions: read

concurrency:
  group: retry-fork-dependencies
  cancel-in-progress: false

jobs:
  retry:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'push' ||
       github.actor_id == 2625904 || github.actor_id == vars.TAVERNARY_PUBLISHER_BOT_ID)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: publisher
    steps:
      - name: Create scoped Publisher wake token
        id: dispatch-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.TAVERNARY_PUBLISHER_CLIENT_ID }}
          private-key: ${{ secrets.TAVERNARY_PUBLISHER_APP_PRIVATE_KEY }}
          permission-actions: write
      - name: Recover retries through the shared writer
        run: gh workflow run automation-writer.yml --ref main -f mode=reconcile
        env:
          GH_TOKEN: ${{ steps.dispatch-token.outputs.token }}
