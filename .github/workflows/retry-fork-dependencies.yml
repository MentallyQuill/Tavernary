name: "Project submissions: Retry fork dependencies"
run-name: "Project submissions: Retry terminal fork dependencies"

on:
  push:
    branches:
      - main
    paths:
      - "data/registry/projects/**"
  workflow_dispatch:
    inputs:
      upstream_issue_number:
        description: Closed upstream project submission issue number
        required: false
        type: number

permissions:
  contents: read
  issues: read
  actions: read

concurrency:
  group: retry-fork-dependencies
  cancel-in-progress: false

jobs:
  retry:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'push' ||
       github.actor_id == 2625904 || github.actor_id == vars.TAVERNARY_PUBLISHER_BOT_ID)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: publisher
    steps:
      - name: Check out trusted retry controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
      - name: Create scoped Publisher wake token
        id: dispatch-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.TAVERNARY_PUBLISHER_CLIENT_ID }}
          private-key: ${{ secrets.TAVERNARY_PUBLISHER_APP_PRIVATE_KEY }}
          permission-actions: write
      - name: Recover retries through the shared writer
        run: node scripts/automation/controller-wake.mjs
        env:
          GH_TOKEN: ${{ steps.dispatch-token.outputs.token }}
