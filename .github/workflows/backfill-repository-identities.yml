name: "Catalog maintenance: Backfill repository IDs"
run-name: "Catalog: Backfill repository IDs"

on:
  workflow_dispatch:
    inputs:
      source_ids:
        description: Optional newline-separated source IDs; at most 256 missing identities per write.
        type: string
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: identity-backfill-request
  cancel-in-progress: false

jobs:
  backfill:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_dispatch' ||
      github.actor_id == 2625904 ||
      github.actor_id == vars.TAVERNARY_PUBLISHER_BOT_ID)
    runs-on: ubuntu-latest
    environment: publisher
    timeout-minutes: 15
    steps:
      - name: Check out current trusted request code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - name: Create fresh Publisher dispatch token
        id: publisher-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.TAVERNARY_PUBLISHER_CLIENT_ID }}
          private-key: ${{ secrets.TAVERNARY_PUBLISHER_APP_PRIVATE_KEY }}
          permission-actions: write
      - name: Request identity maintenance in the shared writer
        shell: bash
        env:
          GH_TOKEN: ${{ steps.publisher-token.outputs.token }}
          SOURCE_IDS: ${{ inputs.source_ids || '' }}
        run: >-
          gh workflow run automation-writer.yml --ref main
          -f mode=backfill-identities -f source_ids="$SOURCE_IDS"
