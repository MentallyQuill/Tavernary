name: "Catalog maintenance: Backfill repository IDs"
run-name: "Catalog: Backfill repository IDs"

on:
  workflow_dispatch:
    inputs:
      source_ids:
        description: Optional newline-separated source IDs; empty selects all.
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: catalog-refresh
  cancel-in-progress: false

jobs:
  backfill:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_dispatch' ||
      github.actor_id == 2625904 ||
      github.actor_id == 41898282)
    runs-on: ubuntu-latest
    environment: publisher
    steps:
      - name: Create Tavernary Publisher token
        id: publisher-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.TAVERNARY_PUBLISHER_APP_ID }}
          private-key: ${{ secrets.TAVERNARY_PUBLISHER_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          token: ${{ steps.publisher-token.outputs.token }}
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Backfill selected identities
        env:
          SOURCE_IDS: ${{ inputs.source_ids || '' }}
        shell: bash
        run: |
          args=(--write)
          while IFS= read -r source_id; do
            [[ -z "$source_id" ]] || args+=(--source-id "$source_id")
          done <<< "$SOURCE_IDS"
          npm run catalog:backfill-identities -- "${args[@]}"
      - name: Validate catalog identities
        run: npm run catalog:validate
      - name: Commit repository identities
        shell: bash
        run: |
          git add data/registry/sources/*.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(catalog): backfill repository identities"
          for attempt in 1 2 3; do
            if git fetch origin main &&
              git rebase origin/main; then
              if npm run catalog:validate &&
                git push origin HEAD:main; then
                break
              fi
            fi
            git rebase --abort || true
            if (( attempt == 3 )); then
              exit 1
            fi
          done
