name: "Project submissions: Retry frontend dependencies"
run-name: "Project submissions: Retry merged frontend dependencies"

on:
  push:
    branches:
      - main
    paths:
      - "data/registry/projects/**"
      - "data/vocabularies/frontends.json"
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  actions: read

concurrency:
  group: retry-frontend-dependencies
  cancel-in-progress: false

jobs:
  retry:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'push' ||
       github.actor_id == 2625904 || github.actor_id == vars.TAVERNARY_PUBLISHER_BOT_ID)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: publisher
    steps:
      - name: Check out trusted retry controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
      - name: Create scoped Publisher wake token
        id: dispatch-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.TAVERNARY_PUBLISHER_CLIENT_ID }}
          private-key: ${{ secrets.TAVERNARY_PUBLISHER_APP_PRIVATE_KEY }}
          permission-actions: write
      - name: Recover retries through the shared writer
        run: node scripts/automation/controller-wake.mjs
        env:
          GH_TOKEN: ${{ steps.dispatch-token.outputs.token }}
