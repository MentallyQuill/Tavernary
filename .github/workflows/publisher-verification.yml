name: "Security: Verify Tavernary Publisher"
run-name: "Security: Verify Publisher write lane #${{ github.run_number }}"

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: tavernary-publisher-verification
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.ref == 'refs/heads/main' && github.actor_id == 2625904
    runs-on: ubuntu-latest
    environment: publisher
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out current trusted request code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - name: Create fresh Publisher dispatch token
        id: publisher-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.TAVERNARY_PUBLISHER_CLIENT_ID }}
          private-key: ${{ secrets.TAVERNARY_PUBLISHER_APP_PRIVATE_KEY }}
          permission-actions: write
      - name: Request authenticated Publisher verification
        shell: bash
        env:
          GH_TOKEN: ${{ steps.publisher-token.outputs.token }}
          REQUEST_RUN_ID: ${{ github.run_id }}
        run: >-
          gh workflow run automation-writer.yml --ref main
          -f mode=verify-publisher -f result_run_id="$REQUEST_RUN_ID"
