name: "Project owner requests: Process review result"
run-name: "Owner review PR #${{ inputs.pull_number || github.event.pull_request.number }}: Process result"

on:
  pull_request:
    types:
      - closed
  workflow_dispatch:
    inputs:
      pull_number:
        description: Merged project owner-request PR number
        required: true
        type: number

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: project-owner-lifecycle-${{ inputs.pull_number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  close:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.pull_request.head.ref, 'automation/project-owner-request-')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PULL_NUMBER: ${{ inputs.pull_number || github.event.pull_request.number }}
    steps:
      - name: Check out default-branch lifecycle code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch || 'main' }}
          fetch-depth: 1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Plan project owner closure
        id: plan
        shell: bash
        env:
          CLOSED_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          pull_path="${RUNNER_TEMP}/project-owner-closure-pull.json"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            gh api "repos/${GITHUB_REPOSITORY}/pulls/${PULL_NUMBER}" > "$pull_path"
          else
            node -e "const e=require(process.env.GITHUB_EVENT_PATH); require('fs').writeFileSync(process.argv[1], JSON.stringify(e.pull_request))" "$pull_path"
          fi
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { planProjectOwnerClosure } from "./scripts/help/project-owner-lifecycle.mjs";

          const pull = JSON.parse(
            fs.readFileSync(
              `${process.env.RUNNER_TEMP}/project-owner-closure-pull.json`,
              "utf8",
            ),
          );
          const plan = planProjectOwnerClosure({
            merged: pull.merged === true,
            headRef: pull.head.ref,
            headRepository: pull.head.repo?.full_name ?? "",
            baseRepository: process.env.GITHUB_REPOSITORY,
            baseRef: pull.base.ref,
            defaultBranch: pull.base.repo?.default_branch ?? "main",
            headSha: pull.head.sha,
            body: pull.body ?? "",
          });
          fs.writeFileSync(
            `${process.env.RUNNER_TEMP}/project-owner-closure.json`,
            JSON.stringify(plan),
          );
          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            [
              `action=${plan.action}`,
              `issue_number=${plan.issueNumber ?? ""}`,
              `branch=${plan.deleteBranch ?? ""}`,
              `head_sha=${pull.head.sha}`,
              `pr_number=${pull.number}`,
              `pr_url=${pull.html_url}`,
            ].join("\n") + "\n",
          );
          NODE
      - name: Synchronize owner issue lifecycle
        if: steps.plan.outputs.action != 'ignore'
        shell: bash
        env:
          ACTION: ${{ steps.plan.outputs.action }}
          ISSUE_NUMBER: ${{ steps.plan.outputs.issue_number }}
          PR_NUMBER: ${{ steps.plan.outputs.pr_number }}
          PR_URL: ${{ steps.plan.outputs.pr_url }}
        run: |
          set -euo pipefail
          if [[ "$ACTION" == "decline" ]]; then
            gh label create submission-declined \
              --color 6e7781 \
              --description "Submission was declined during maintainer review." \
              --force
          fi
          issue_path="${RUNNER_TEMP}/project-owner-lifecycle-issue.json"
          labels_path="${RUNNER_TEMP}/project-owner-lifecycle-labels.json"
          gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}" > "$issue_path"
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const issue = JSON.parse(
            fs.readFileSync(`${process.env.RUNNER_TEMP}/project-owner-lifecycle-issue.json`, "utf8"),
          );
          const plan = JSON.parse(
            fs.readFileSync(`${process.env.RUNNER_TEMP}/project-owner-closure.json`, "utf8"),
          );
          const removed = new Set(plan.removeLabels ?? []);
          const labels = issue.labels
            .map((label) => label.name)
            .filter((label) => !removed.has(label));
          labels.push(...(plan.addLabels ?? []));
          fs.writeFileSync(
            `${process.env.RUNNER_TEMP}/project-owner-lifecycle-labels.json`,
            JSON.stringify({ labels: [...new Set(labels)] }),
          );
          NODE
          gh api --method PUT \
            "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/labels" \
            --input "$labels_path"
          if [[ "$ACTION" == "decline" ]]; then
            marker="<!-- tavernary-project-owner-declined-pr:${PR_NUMBER} -->"
            existing_id="$(gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
              --jq ".[] | select(.body | contains(\"$marker\")) | .id" | head -n 1)"
            if [[ -z "$existing_id" ]]; then
              comment_path="${RUNNER_TEMP}/project-owner-declined-comment.json"
              node -e "
                require('fs').writeFileSync(
                  process.argv[1],
                  JSON.stringify({
                    body: process.argv[2] +
                      '\nThe generated owner-request review PR was closed without merging: ' +
                      process.argv[3],
                  }),
                );
              " "$comment_path" "$marker" "$PR_URL"
              gh api --method POST \
                "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
                --input "$comment_path"
            fi
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}" \
              -f state=closed \
              -f state_reason=not_planned
          fi
