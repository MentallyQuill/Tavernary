name: Triage project submission

on:
  issues:
    types:
      - labeled
      - edited
  workflow_dispatch:
    inputs:
      issue_number:
        description: Project submission issue number
        required: true
        type: number

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: triage-project-${{ inputs.issue_number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  validate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        contains(github.event.issue.labels.*.name, 'project-submission') &&
        github.event.issue.state == 'open' &&
        contains(github.event.issue.labels.*.name, 'issue-admitted') &&
        (
          github.event.action == 'edited' ||
          (
            github.event.action == 'labeled' &&
            github.event.label.name == 'issue-admitted'
          )
        )
      )
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Validate and label submission
        id: triage
        run: node scripts/submissions/triage-issue.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ inputs.issue_number || github.event.issue.number }}
      - name: Generate admitted submission
        if: steps.triage.outputs.admitted == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.triage.outputs.issue_number }}
        run: >
          gh workflow run generate-project-submission.yml
          --ref main
          -f issue_number="$ISSUE_NUMBER"
          -f force_regeneration=false
