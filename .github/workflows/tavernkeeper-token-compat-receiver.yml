name: "Temporary: Receive opaque TavernKeeper token proof"

run-name: "Temporary: TavernKeeper token receiver (${{ inputs.format }})"

on:
  workflow_dispatch:
    inputs:
      format:
        description: Compatibility format label
        required: true
        type: choice
        options:
          - enabled
          - disabled

permissions: {}

jobs:
  receive:
    runs-on: ubuntu-latest
    steps:
      - name: Record non-secret compatibility evidence
        env:
          FORMAT: ${{ inputs.format }}
        run: echo "format=$FORMAT actor_id=$GITHUB_ACTOR_ID"
